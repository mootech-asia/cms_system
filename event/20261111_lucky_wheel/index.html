<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucky Wheel</title>
    <meta name="description" content="Spin the Lucky Wheel and win prizes!" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lucky Wheel" />
    <meta property="og:description" content="Spin the Lucky Wheel and win prizes!" />
    <meta property="og:url" content="https://mootech-asia.github.io/cms_system/event/20261111_lucky_wheel/" />
    <meta property="og:image" content="https://mootech-asia.github.io/cms_system/event/20261111_lucky_wheel/assets/img/share-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lucky Wheel" />
    <meta name="twitter:description" content="Spin the Lucky Wheel and win prizes!" />
    <meta name="twitter:image" content="https://mootech-asia.github.io/cms_system/event/20261111_lucky_wheel/assets/img/share-preview.jpg" />
    <link rel="stylesheet" href="assets/css/event.css" />
  </head>
  <body>
    <section class="ev-stage" id="stage" data-img="stageBg" data-i18n-aria="stage.aria">
      <div class="ev-stage-dim" aria-hidden="true"></div>
      <img class="ev-spot ev-spot--l" data-img="spotlight" alt="" />
      <img class="ev-spot ev-spot--r" data-img="spotlight" alt="" />

      <div class="ev-topbar">
        <div class="ev-lang" id="langSwitch"></div>
        <div class="ev-sound-wrap">
          <button type="button" class="ev-sound" id="btnShare" data-i18n-aria="share.button">
            <img data-img="share" alt="" />
          </button>
          <button type="button" class="ev-sound" id="btnSound" aria-pressed="true">
            <img id="soundIcon" alt="" />
          </button>
          <span class="ev-asset ev-asset--sound" data-asset="share sound" aria-hidden="true"></span>
        </div>
      </div>

      <div class="ev-stage-inner">
        <h1 class="ev-title">
          <img data-img="title" data-i18n-alt="title.alt" alt="Lucky Wheel" />
          <span class="ev-asset ev-asset--title" data-asset="title" aria-hidden="true"></span>
        </h1>
        <p class="ev-period-wrap"><span class="ev-period" id="period"></span><span class="ev-asset ev-asset--period" data-asset="periodBadge" aria-hidden="true"></span></p>

        <div class="ev-play">
        <div class="ev-wheel-area">
          <div class="ev-wheel-cast" aria-hidden="true"></div>
          <div class="ev-wheel-cast-pole" aria-hidden="true"></div>
          <div class="ev-wheel-stand" aria-hidden="true">
            <img class="ev-light-pool" data-img="lightPool" alt="" />
            <img data-img="wheelStand" alt="" />
            <span class="ev-asset ev-asset--stand" data-asset="wheelStand lightPool"></span>
          </div>
          <div class="ev-wheel">
            <img class="ev-wheel-frame" data-img="wheelFrame" alt="" />
            <div class="ev-wheel-disc" id="wheelDisc">
              <svg viewBox="-300 -300 600 600" aria-hidden="true"></svg>
              <ol class="ev-wheel-labels" id="wheelLabels"></ol>
            </div>
            <img class="ev-wheel-gloss" data-img="wheelGloss" alt="" />
            <div class="ev-wheel-bulbs" id="wheelBulbs" aria-hidden="true"></div>
            <p class="ev-wheel-empty" id="wheelEmpty" data-i18n="wheel.empty" hidden></p>
            <img class="ev-wheel-pointer" data-img="pointer" alt="" />
            <button type="button" class="ev-wheel-go" id="btnSpin" data-i18n-aria="spin.aria">
              <img data-img="btnGo" alt="" />
              <span class="ev-wheel-go-text" data-i18n="spin.text" aria-hidden="true"></span>
            </button>
            <span class="ev-asset ev-asset--tl" data-asset="wheelFrame bulbs" aria-hidden="true"></span>
            <span class="ev-asset ev-asset--tr" data-asset="pointer" aria-hidden="true"></span>
            <span class="ev-asset ev-asset--bl" data-asset="btnGo wheelGloss" aria-hidden="true"></span>
          </div>
        </div>

        <div class="ev-console">
          <div class="ev-host">
            <img class="ev-mascot" id="mascot" alt="" />
            <span class="ev-asset ev-asset--mascot" data-asset="mascot" aria-hidden="true"></span>
          </div>

          <div class="ev-ticker" id="ticker">
            <span class="ev-ticker-label" data-i18n="ticker.label"></span>
            <div class="ev-ticker-track"><div class="ev-ticker-items" id="tickerItems"></div></div>
            <span class="ev-asset ev-asset--ticker" data-asset="tickerBar" aria-hidden="true"></span>
          </div>
          <div class="ev-console-row">
            <p class="ev-chances">
              <span data-i18n="chances.before"></span>
              <strong id="chances">0</strong>
              <span data-i18n="chances.after"></span>
            </p>
            <button type="button" class="ev-cta" id="btnSpinCta"><span data-i18n="cta.spin"></span></button>
            <span class="ev-asset ev-asset--chances" data-asset="chancesBadge btnPrimary" aria-hidden="true"></span>
          </div>
        </div>
        </div>
      </div>

      <div class="ev-stage-floor-wrap">
        <img class="ev-stage-floor" data-img="stageFloor" alt="" />
      </div>
    </section>

    <section class="ev-info" data-img="infoBg" data-i18n-aria="info.aria">
      <div class="ev-info-inner">
        <span class="ev-asset ev-asset--floor" data-asset="stageBg stageFloor spotlight stageVignette" aria-hidden="true"></span>
        <article class="ev-card">
          <span class="ev-asset ev-asset--card" data-asset="cardFrame cardTitle" aria-hidden="true"></span>
          <h2 class="ev-card-title" id="rulesTitle"></h2>
          <ol class="ev-rules" id="rulesList"></ol>
          <p class="ev-slot" id="rulesEmpty" data-i18n="rules.empty" hidden></p>
        </article>

        <article class="ev-card">
          <h2 class="ev-card-title" data-i18n="records.title"></h2>
          <ul class="ev-record-list" id="recordList">
            <li class="ev-empty" id="recordEmpty" data-i18n="records.empty"></li>
          </ul>
        </article>

        <div class="ev-footer-deco" aria-hidden="true">
          <span class="ev-asset ev-asset--floor" data-asset="footerDeco"></span>
        </div>

        <div class="ev-mock-tools" id="mockTools" hidden>
          <span data-i18n="mock.tools"></span>
          <button type="button" class="ev-link" id="btnReset" data-i18n="mock.reset"></button>
          <button type="button" class="ev-link" id="btnLabels" aria-pressed="true">
            <span data-i18n="mock.labels"></span>: <span id="labelsState"></span>
          </button>
        </div>
      </div>
    </section>

    <div class="ev-modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
      <div class="ev-modal-wrap">
        <div class="ev-modal-box" data-img="modalBg">
          <h2 class="ev-modal-title" id="resultTitle"></h2>
          <img class="ev-modal-icon" id="resultIcon" alt="" />
          <p class="ev-modal-prize" id="resultName"></p>
          <button type="button" class="ev-btn" id="btnClose" data-img="btnPrimary"></button>
        </div>
        <span class="ev-asset ev-asset--modal" data-asset="modalBg btnPrimary" aria-hidden="true"></span>
      </div>
    </div>

    <div class="ev-sheet" id="shareSheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle" hidden>
      <div class="ev-sheet-panel">
        <div class="ev-sheet-head">
          <h2 class="ev-sheet-title" id="shareTitle" data-i18n="share.title"></h2>
          <button type="button" class="ev-sheet-close" id="btnShareClose" data-i18n-aria="share.close">×</button>
        </div>
        <div class="ev-share-grid" id="shareLinks"></div>
        <div class="ev-share-url">
          <input class="ev-share-input" id="shareUrl" type="text" readonly data-i18n-aria="share.urlLabel" />
          <button type="button" class="ev-share-copy" id="btnShareCopy" data-i18n="share.copy"></button>
        </div>
        <button type="button" class="ev-link ev-share-native" id="btnShareNative" data-i18n="share.more" hidden></button>
      </div>
    </div>

    <div class="ev-toast" id="toast" role="status" aria-live="polite" hidden></div>

    <div class="ev-rotate" role="alert">
      <img class="ev-rotate-icon" data-img="rotateHint" alt="" />
      <p class="ev-rotate-text" data-i18n="rotate.hint"></p>
      <span class="ev-asset ev-asset--rotate" data-asset="rotateHint" aria-hidden="true"></span>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/sound.js"></script>
    <script src="assets/js/share.js"></script>
    <script src="assets/js/wheel.js"></script>
  </body>
</html>
