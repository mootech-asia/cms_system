<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>幸運大轉盤</title>
    <link rel="stylesheet" href="assets/css/event.css" />
  </head>
  <body>
    <div class="ev-page" data-img="bg">
      <header class="ev-header">
        <h1 class="ev-title"><img data-img="title" alt="幸運大轉盤" /></h1>
        <p class="ev-period">活動期間：2026/11/11 – 2026/11/30</p>
      </header>

      <main class="ev-main">
        <section class="ev-wheel" aria-label="轉盤">
          <img class="ev-wheel-frame" data-img="wheelFrame" alt="" />
          <div class="ev-wheel-disc" id="wheelDisc">
            <img data-img="wheelDisc" alt="" />
            <ol class="ev-wheel-labels" id="wheelLabels"></ol>
          </div>
          <img class="ev-wheel-pointer" data-img="pointer" alt="" />
          <button type="button" class="ev-wheel-go" id="btnSpin" aria-label="開始抽獎">
            <img data-img="btnGo" alt="" />
          </button>
        </section>

        <p class="ev-chances">剩餘抽獎次數：<strong id="chances">0</strong> 次</p>

        <section class="ev-panel">
          <h2 class="ev-panel-title">獎項一覽</h2>
          <ul class="ev-prize-list" id="prizeList"></ul>
        </section>

        <section class="ev-panel">
          <h2 class="ev-panel-title">我的中獎紀錄</h2>
          <ul class="ev-record-list" id="recordList">
            <li class="ev-empty" id="recordEmpty">還沒有紀錄，轉一次試試手氣。</li>
          </ul>
        </section>

        <section class="ev-panel">
          <h2 class="ev-panel-title">活動規則</h2>
          <ol class="ev-rules">
            <li>活動期間每位會員可獲得 3 次免費抽獎機會。</li>
            <li>獎項於中獎後 24 小時內發放至會員帳戶。</li>
            <li>本頁為 mock up，抽獎結果由前端隨機產生，僅供展示。</li>
          </ol>
          <button type="button" class="ev-link" id="btnReset">重設次數（mock 用）</button>
        </section>
      </main>
    </div>

    <div class="ev-modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
      <div class="ev-modal-box" data-img="modalBg">
        <h2 class="ev-modal-title" id="resultTitle">恭喜中獎</h2>
        <img class="ev-modal-icon" id="resultIcon" alt="" />
        <p class="ev-modal-prize" id="resultName"></p>
        <button type="button" class="ev-btn" id="btnClose" data-img="btnPrimary">收下獎勵</button>
      </div>
    </div>

    <div class="ev-toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/wheel.js"></script>
  </body>
</html>
