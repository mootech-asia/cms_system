  <body data-event-controls="desert">
    <div class="ev-loading" id="loading" data-theme="desert" role="status" aria-live="polite">

        <p class="ev-loading-subtitle" data-i18n="loading.scene">Unveiling the desert treasure</p>

        <p class="ev-loading-pct" id="loadingPct" aria-hidden="true">0%</p>
        <span class="ev-loading-signature" aria-hidden="true"></span>
      </div>
    </div>

    <section class="ev-stage" id="stage" data-img="stageBg" data-state="select">
      <div class="ev-topbar">
        <div class="ev-lang" id="langSwitch"></div>
        <div class="ev-sound-wrap">
          <button type="button" class="ev-sound" id="btnShare" aria-expanded="false" aria-haspopup="dialog" aria-controls="shareSheet" data-i18n-aria="share.button"><img data-img="share" alt="" hidden /><svg class="ev-tool-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 10.5 16 6.5M9 13.5l7 4"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="5" r="3"/><circle cx="18" cy="19" r="3"/></svg></button>
          <button type="button" class="ev-sound" id="btnSound" aria-pressed="true"><img id="soundIcon" alt="" hidden /><svg class="ev-tool-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4z"/><g class="ev-tool-waves"><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></g><path class="ev-tool-muted" d="m16 9 6 6m0-6-6 6"/></svg></button>
          <span class="ev-asset ev-asset--sound" data-asset="share sound" aria-hidden="true"></span>
        </div>
      </div>

      <div class="ev-stage-inner">
        <h1 class="ev-title">
          <img data-img="title" data-i18n-alt="title.alt" alt="Desert Genie’s Gift" />
          <span class="ev-asset ev-asset--title" data-asset="title" aria-hidden="true"></span>
        </h1>
        <p class="ev-period-wrap"><span class="ev-period" id="period"></span><span class="ev-asset ev-asset--period" data-asset="periodBadge" aria-hidden="true"></span></p>

        <div class="ev-scene" id="scene" role="group" tabindex="0" data-i18n-aria="scene.aria">
          <div class="ev-spirit-stage" id="spiritStage" aria-hidden="true"><img class="ev-mascot" id="mascot" alt="" /></div>
          <img class="ev-scene-fallback" id="sceneFallback" alt="" hidden />

          <button type="button" class="ev-arrow ev-arrow--prev" id="btnPrev" data-i18n-aria="prev"><img data-img="btnArrow" alt="" /></button>
          <button type="button" class="ev-arrow ev-arrow--next" id="btnNext" data-i18n-aria="next"><img data-img="btnArrow" alt="" /></button>
          <div class="ev-swipe-cue" aria-hidden="true"><span class="ev-swipe-hand"><img data-img="tapHint" alt="" /></span><span data-i18n="hint.swipeUp"></span></div>
          <p class="ev-pick-label" id="pickLabel" aria-live="polite"></p>
          <div class="ev-panel" id="mockPanel" hidden>
            <div class="ev-panel-row">
              <span class="ev-panel-label" data-i18n="mock.perOpen"></span>
              <button type="button" id="panelLess" aria-label="−">−</button>
              <b id="panelPerOpen"></b>
              <button type="button" id="panelMore" aria-label="+">+</button>
            </div>
            <div class="ev-panel-row ev-panel-row--two">
              <button type="button" class="ev-panel-text" id="btnReset" data-i18n="mock.reset"></button>
              <button type="button" class="ev-panel-text" id="btnLabels" aria-pressed="false"><span data-i18n="mock.labels"></span>: <span id="labelsState"></span></button>
            </div>
            <button type="button" class="ev-panel-close" id="panelClose" aria-label="×">×</button>
          </div>
          <span class="ev-asset ev-asset--scene" data-asset="boxFront boxSide boxLid boxLidSide btnArrow stageBg" aria-hidden="true"></span>
        </div>

        <div class="ev-console">
          <p class="ev-chances">
            <span data-i18n="chances.before"></span>
            <strong id="chances">0</strong>
            <span data-i18n="chances.after"></span>
          </p>
          <p class="ev-pick-hint" id="pickHint"><span class="ev-pick-hint-icon" aria-hidden="true"><img data-img="tapHint" alt="" /></span><span id="pickHintText"></span></p>
          <button type="button" class="ev-action" id="btnAction" hidden><span id="actionText"></span></button>
          <p class="ev-status" id="status" role="status" aria-live="polite"></p>
          <div class="ev-console-links">
            <button type="button" class="ev-link" id="btnBack" data-i18n="action.back" hidden></button>
            <button type="button" class="ev-link" id="btnSkip" data-i18n="action.skip" hidden></button>
          </div>
          <div class="ev-ticker" id="ticker">
            <span class="ev-ticker-label" data-i18n="ticker.label"></span>
            <div class="ev-ticker-track"><div class="ev-ticker-items" id="tickerItems"></div></div>

          <span class="ev-asset ev-asset--console" data-asset="chancesBadge btnPrimary tapHint" aria-hidden="true"></span>
        </div>
      </div>

        <article class="ev-card ev-card--collection">

            <li class="ev-empty" id="recordEmpty" data-i18n="records.empty"></li>

        <div class="ev-reveal-actions">
          <button type="button" class="ev-action" id="btnReveal"><span id="revealActionText"></span></button>
          <button type="button" class="ev-link" id="btnRevealAll" data-i18n="reveal.all"></button>
        </div>
        <span class="ev-asset ev-asset--reveal" data-asset="revealVortex rewardBack rewardFrame" aria-hidden="true"></span>
      </div>
    </div>

    <div class="ev-sheet" id="shareSheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle" hidden>
      <div class="ev-sheet-panel">
        <div class="ev-sheet-head">
          <h2 class="ev-sheet-title" id="shareTitle" data-i18n="share.title"></h2>
          <button type="button" class="ev-sheet-close" id="btnShareClose" data-i18n-aria="share.close">×</button>

        </div>
        <button type="button" class="ev-link ev-share-native" id="btnShareNative" data-i18n="share.more" hidden></button>

    <div class="ev-toast" id="toast" role="status" aria-live="polite" hidden></div>
