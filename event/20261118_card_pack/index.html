<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Pack Opening</title>
    <meta name="description" content="Open a card pack and collect rare cards!" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Card Pack Opening" />
    <meta property="og:description" content="Open a card pack and collect rare cards!" />
    <meta property="og:url" content="https://mootech-asia.github.io/cms_system/event/20261118_card_pack/" />
    <meta property="og:image" content="https://mootech-asia.github.io/cms_system/event/20261118_card_pack/assets/img/share/share-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Card Pack Opening" />
    <meta name="twitter:description" content="Open a card pack and collect rare cards!" />
    <meta name="twitter:image" content="https://mootech-asia.github.io/cms_system/event/20261118_card_pack/assets/img/share/share-preview.png" />
    <link rel="preload" as="image" href="assets/img/scene/stage-bg.svg" fetchpriority="high" />
    <link rel="modulepreload" href="../shared/unbox-3d/vendor/three.min.js?v=20261118e" />
    <link rel="stylesheet" href="../shared/unbox-3d/css/unbox.css?v=20261118e" />
    <link rel="stylesheet" href="assets/css/theme.css?v=20261118e" />
  </head>
  <body>
    <div class="ev-loading" id="loading" role="status" aria-live="polite">
      <div class="ev-loading-box">
        <p class="ev-loading-title" data-i18n="loading.title">Loading…</p>
        <div class="ev-loading-bar"><div class="ev-loading-fill" id="loadingFill"></div></div>
        <p class="ev-loading-pct" id="loadingPct">0%</p>
      </div>
    </div>

    <section class="ev-stage" id="stage" data-img="stageBg" data-state="select">
      <div class="ev-topbar">
        <div class="ev-lang" id="langSwitch"></div>
        <div class="ev-sound-wrap">
          <button type="button" class="ev-sound" id="btnShare" data-i18n-aria="share.button"><img data-img="share" alt="" /></button>
          <button type="button" class="ev-sound" id="btnSound" aria-pressed="true"><img id="soundIcon" alt="" /></button>
          <span class="ev-asset ev-asset--sound" data-asset="share sound" aria-hidden="true"></span>
        </div>
      </div>

      <div class="ev-stage-inner">
        <h1 class="ev-title">
          <img data-img="title" data-i18n-alt="title.alt" alt="Card Pack Opening" />
          <span class="ev-asset ev-asset--title" data-asset="title" aria-hidden="true"></span>
        </h1>
        <p class="ev-period-wrap"><span class="ev-period" id="period"></span><span class="ev-asset ev-asset--period" data-asset="periodBadge" aria-hidden="true"></span></p>

        <div class="ev-scene" id="scene" role="group" tabindex="0" data-i18n-aria="scene.aria">
          <img class="ev-mascot" id="mascot" alt="" aria-hidden="true" />
          <img class="ev-scene-fallback" id="sceneFallback" alt="" hidden />
          <p class="ev-scene-note" id="sceneNote" data-i18n="status.no3d" hidden></p>
          <button type="button" class="ev-arrow ev-arrow--prev" id="btnPrev" data-i18n-aria="prev"><img data-img="btnArrow" alt="" /></button>
          <button type="button" class="ev-arrow ev-arrow--next" id="btnNext" data-i18n-aria="next"><img data-img="btnArrow" alt="" /></button>
          <p class="ev-pick-label" id="pickLabel" aria-live="polite"></p>
          <div class="ev-panel" id="mockPanel" hidden>
            <div class="ev-panel-row">
              <span class="ev-panel-label" data-i18n="mock.perOpen"></span>
              <button type="button" id="panelLess" aria-label="−">−</button>
              <b id="panelPerOpen"></b>
              <button type="button" id="panelMore" aria-label="+">+</button>
            </div>
            <div class="ev-panel-row ev-panel-row--two">
              <button type="button" class="ev-panel-text" id="btnReset" data-i18n="mock.reset"></button>
              <button type="button" class="ev-panel-text" id="btnLabels" aria-pressed="false"><span data-i18n="mock.labels"></span>: <span id="labelsState"></span></button>
            </div>
            <button type="button" class="ev-panel-close" id="panelClose" aria-label="×">×</button>
          </div>
          <span class="ev-asset ev-asset--scene" data-asset="packFront packBack packCrimp btnArrow stageBg" aria-hidden="true"></span>
        </div>

        <div class="ev-console">
          <p class="ev-chances">
            <span data-i18n="chances.before"></span>
            <strong id="chances">0</strong>
            <span data-i18n="chances.after"></span>
          </p>
          <p class="ev-pick-hint" id="pickHint"><img class="ev-pick-hint-icon" data-img="tapHint" alt="" aria-hidden="true" /><span id="pickHintText"></span></p>
          <button type="button" class="ev-action" id="btnAction" hidden><span id="actionText"></span></button>
          <p class="ev-status" id="status" role="status" aria-live="polite"></p>
          <div class="ev-console-links">
            <button type="button" class="ev-link" id="btnBack" data-i18n="action.back" hidden></button>
            <button type="button" class="ev-link" id="btnSkip" data-i18n="action.skip" hidden></button>
          </div>
          <div class="ev-ticker" id="ticker">
            <span class="ev-ticker-label" data-i18n="ticker.label"></span>
            <div class="ev-ticker-track"><div class="ev-ticker-items" id="tickerItems"></div></div>
            <span class="ev-asset ev-asset--ticker" data-asset="tickerBar" aria-hidden="true"></span>
          </div>
          <span class="ev-asset ev-asset--console" data-asset="chancesBadge btnPrimary tapHint" aria-hidden="true"></span>
        </div>
      </div>
    </section>

    <section class="ev-info" data-img="infoBg" data-i18n-aria="info.aria">
      <div class="ev-info-inner">
        <article class="ev-card">
          <span class="ev-asset ev-asset--card" data-asset="cardFrame cardTitle infoBg" aria-hidden="true"></span>
          <h2 class="ev-card-title" id="rulesTitle"></h2>
          <ol class="ev-rules" id="rulesList"></ol>
          <p class="ev-slot" id="rulesEmpty" data-i18n="rules.empty" hidden></p>
        </article>
        <article class="ev-card">
          <h2 class="ev-card-title" data-i18n="records.title"></h2>
          <ul class="ev-record-list" id="recordList">
            <li class="ev-empty" id="recordEmpty" data-i18n="records.empty"></li>
          </ul>
        </article>
        <div class="ev-footer-deco" aria-hidden="true">
          <span class="ev-asset ev-asset--floor" data-asset="footerDeco"></span>
        </div>
      </div>
    </section>

    <div class="ev-reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="revealTitle" hidden>
      <div class="ev-reveal-inner">
        <h2 class="ev-reveal-title" id="revealTitle"></h2>
        <p class="ev-reveal-count" id="revealCount" aria-live="polite"></p>
        <div class="ev-reveal-single" id="revealSingle">
          <div class="ev-reveal-glow" id="revealGlow" aria-hidden="true"></div>
          <img class="ev-reveal-rays" data-img="revealRays" alt="" />
          <button type="button" class="ev-prize-card" id="revealCard"></button>
        </div>
        <ul class="ev-reveal-grid" id="revealGrid" hidden></ul>
        <div class="ev-reveal-actions">
          <button type="button" class="ev-action" id="btnReveal"><span id="revealActionText"></span></button>
          <button type="button" class="ev-link" id="btnRevealAll" data-i18n="reveal.all"></button>
        </div>
        <span class="ev-asset ev-asset--reveal" data-asset="revealRays rewardBack rewardFrame" aria-hidden="true"></span>
      </div>
    </div>

    <div class="ev-sheet" id="shareSheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle" hidden>
      <div class="ev-sheet-panel">
        <div class="ev-sheet-head">
          <h2 class="ev-sheet-title" id="shareTitle" data-i18n="share.title"></h2>
          <button type="button" class="ev-sheet-close" id="btnShareClose" data-i18n-aria="share.close">×</button>
        </div>
        <div class="ev-share-grid" id="shareLinks"></div>
        <div class="ev-share-url">
          <input class="ev-share-input" id="shareUrl" type="text" readonly data-i18n-aria="share.urlLabel" />
          <button type="button" class="ev-share-copy" id="btnShareCopy" data-i18n="share.copy"></button>
        </div>
        <button type="button" class="ev-link ev-share-native" id="btnShareNative" data-i18n="share.more" hidden></button>
      </div>
    </div>

    <div class="ev-toast" id="toast" role="status" aria-live="polite" hidden></div>

    <div class="ev-rotate" role="alert">
      <img class="ev-rotate-icon" data-img="rotateHint" alt="" />
      <p class="ev-rotate-text" data-i18n="rotate.hint"></p>
      <span class="ev-asset ev-asset--rotate" data-asset="rotateHint" aria-hidden="true"></span>
    </div>

    <script defer src="assets/js/config.js?v=20261118e"></script>
    <script defer src="../shared/unbox-3d/js/skin.js?v=20261118e"></script>
    <script defer src="../shared/unbox-3d/js/i18n.js?v=20261118e"></script>
    <script defer src="../shared/unbox-3d/js/store.js?v=20261118e"></script>
    <script defer src="../shared/unbox-3d/js/sound.js?v=20261118e"></script>
    <script defer src="../shared/unbox-3d/js/share.js?v=20261118e"></script>
    <script type="module" src="../shared/unbox-3d/js/app.js?v=20261118e"></script>
  </body>
</html>
