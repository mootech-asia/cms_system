      <div class="flex items-center gap-3">

          <span class="h-10 w-10 rounded-full bg-accent-soft grid place-items-center text-accent font-bold text-[13px]">PL</span>

           account.html 的 .rewards-bar（--rk-pct: 62%），跟手機版 account.html
           既有那份完整版共用同一個真實數值，不是這裡另外編的假資料。 -->
      <div class="mt-2.5">
        <div class="h-1.5 overflow-hidden rounded-full border border-line bg-bg-elev" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62" aria-label="Level progress: 62%">

        </div>
        <div class="mt-1 flex items-center justify-between text-[10px] font-semibold text-text-dim">
          <span data-i18n="account.tierUnranked">未排名</span>
          <span>62%</span>
          <span class="text-accent" data-i18n="account.tierBronze">銅級</span>
