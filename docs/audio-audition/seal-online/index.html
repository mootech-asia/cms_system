<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event sound audition</title><style>:root{color-scheme:dark;--bg:#100d20;--panel:#211a35;--ink:#f4ebff;--accent:#bba0ff}body{margin:0 auto;padding:24px;max-width:850px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui}h1{font-size:26px}p{color:#cbc0df}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}article{padding:18px;background:var(--panel);border-radius:12px}audio{width:100%;margin:12px 0}button,select{font:inherit;padding:8px;color:var(--ink);background:var(--bg);border:1px solid var(--accent);border-radius:6px}textarea{box-sizing:border-box;width:100%;min-height:120px;background:var(--panel);color:var(--ink);padding:12px}small{display:block;color:#cbc0df}</style><h1>Magic event · Sound audition</h1><p>Source: seal_online / sound. Candidates only; not applied to the events. Preview volume is normalized. Pick a role for sounds you like, then copy your selection.</p><section id="sounds"></section><h2>Your selection</h2><textarea id="selection" readonly aria-label="Selected sounds"></textarea><button id="copy">Copy selection</button><p id="status" role="status"></p><script>
(async()=>{const rows=await(await fetch('manifest.json')).json();const roles=['Not selected','Click / hover','Choose / rotate','Open / tear','Common reward','Rare reward','Secret reward','No prize','Collect'];for(const r of rows){const card=document.createElement('article');const label=document.createElement('strong');label.textContent=r.name;card.append(label);const info=document.createElement('small');info.textContent=r.duration+' seconds';card.append(info);const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=r.file;a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(x=>{if(x!==a)x.pause()}));card.append(a);const sel=document.createElement('select');sel.setAttribute('aria-label','Role for '+r.name);roles.forEach(role=>sel.add(new Option(role,role)));sel.onchange=()=>{r.role=sel.value;document.querySelector('#selection').value=rows.filter(x=>x.role&&x.role!=='Not selected').map(x=>x.role+': '+x.name).join('\n')};card.append(sel);document.querySelector('#sounds').append(card)}document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.querySelector('#selection').value);document.querySelector('#status').textContent='Copied'}catch{document.querySelector('#selection').select();document.querySelector('#status').textContent='Select and copy the text above'}}})();
</script></html>
