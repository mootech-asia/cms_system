<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>

      <main class="bg-navy">
        <section class="relative bg-navy overflow-hidden">
          <div class="relative w-full" data-banner-slides>
            <div class="w-full hidden [&.is-active]:block is-active" data-banner-slide><img src="assets/images/banner/banner.jpg" alt="banner" class="w-full block" /></div>
            <div class="w-full hidden [&.is-active]:block" data-banner-slide><img src="assets/images/banner/banner-2.jpg" alt="banner" class="w-full block" /></div>
          </div>
          <div class="absolute left-1/2 bottom-2 -translate-x-1/2 z-20 flex items-center gap-3" data-banner-dots>
            <button type="button" class="w-3 h-3 rounded-full !bg-white/95 [&.is-active]:w-6 [&.is-active]:h-6 [&.is-active]:!bg-transparent [&.is-active]:!border-[3px] [&.is-active]:!border-white/95 is-active" data-dot-index="0" aria-label="Go to slide 1"></button>
            <button type="button" class="w-3 h-3 rounded-full !bg-white/95 [&.is-active]:w-6 [&.is-active]:h-6 [&.is-active]:!bg-transparent [&.is-active]:!border-[3px] [&.is-active]:!border-white/95" data-dot-index="1" aria-label="Go to slide 2"></button>
          </div>
        </section>

        <div class="pt-4 px-5 pb-12 xl:py-16 xl:px-24">
          <div class="inline-block border-b-2 border-transparent [border-image:var(--g-primary)] [border-image-slice:1] pb-2 mb-4"><h1 class="text-gradient m-0 text-[20px] font-bold xl:text-[28px]" data-i18n="navbar.desktop.promotion">프로모션</h1></div>

          <nav class="flex overflow-x-auto border-b border-[#4f4f4f] [&::-webkit-scrollbar]:hidden" data-promo-categories></nav>

          <div data-promo-grid></div>
        </div>
      </main>

      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        var PAGE_SIZE = 8;

        /* ---- Banner(對照 components/Banner.vue,與首頁共用同一組輪播圖) ---- */
        var slides = W.qsa('[data-banner-slide]');
        var dots = W.qsa('[data-dot-index]');
        var bannerActive = 0;
        function showBanner(i) {
          bannerActive = i;
          slides.forEach(function (s, idx) { s.classList.toggle('is-active', idx === i); });
          dots.forEach(function (d, idx) { d.classList.toggle('is-active', idx === i); });
        }
        dots.forEach(function (d, i) { W.on(d, 'click', function () { showBanner(i); }); });
        if (slides.length > 1) {
          setInterval(function () { showBanner((bannerActive + 1) % slides.length); }, 6000);
        }

        /* ---- 分類頁籤 + 卡片清單(對照 pages/promotionList.vue) ---- */
        var CATEGORIES = ['all', 'new', 'slot', 'live', 'sports'];
        var activeCategory = 'all';
        var visibleCount = PAGE_SIZE;

        var catsEl = W.qs('[data-promo-categories]');
        var gridEl = W.qs('[data-promo-grid]');

        var PROMO_CAT_TAB_CLS = 'shrink-0 whitespace-nowrap !py-2 !px-4 !text-white !font-semibold !border-b-2 !border-transparent [&.is-active]:[border-image:var(--g-primary)] [&.is-active]:[border-image-slice:1]';
        function renderCategories() {
          catsEl.innerHTML = CATEGORIES.map(function (key) {
            return '<button type="button" class="' + PROMO_CAT_TAB_CLS + (key === activeCategory ? ' is-active' : '') +
              '" data-promo-cat="' + key + '"><span class="' + (key === activeCategory ? 'text-gradient' : '') +
              '" data-i18n="promotionList.categories.' + key + '">' + W.t('promotionList.categories.' + key) + '</span></button>';
          }).join('');
          W.qsa('[data-promo-cat]', catsEl).forEach(function (btn) {
            W.on(btn, 'click', function () {
              activeCategory = btn.getAttribute('data-promo-cat');
              visibleCount = PAGE_SIZE;
              renderCategories();
              renderGrid();
            });
          });
        }

        function formatDate(ts) {
          var d = new Date(ts * 1000);
          function pad(n) { return String(n).padStart(2, '0'); }
          return d.getUTCFullYear() + '.' + pad(d.getUTCMonth() + 1) + '.' + pad(d.getUTCDate());
        }

        function renderGrid() {
          var loc = W.currentLocale();
          var list = D.PROMOTIONS.filter(function (p) { return activeCategory === 'all' || p.category === activeCategory; });
          if (!list.length) {
            gridEl.innerHTML = '<div class="py-16 text-center text-white/60 text-[14px]" data-i18n="common.noData">' + W.t('common.noData') + '</div>';
            return;
          }
          var visible = list.slice(0, visibleCount);
          gridEl.innerHTML = '<div class="grid grid-cols-[repeat(1,1fr)] gap-6 mt-4 md:grid-cols-[repeat(2,1fr)] xl:grid-cols-[repeat(4,1fr)] xl:gap-4">' + visible.map(function (p, idx) {
            var badge = p.endDate ? formatDate(p.startDate) + ' - ' + formatDate(p.endDate) : '∞';
            return (
              '<div class="group rounded-[28px] overflow-hidden cursor-pointer" data-promo-card="' + idx + '">' +
              '<div class="h-[168px] overflow-hidden"><img src="assets/images/index/promotion/' + p.image + '" alt="promotion" class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-110"></div>' +
              '<p class="m-0 text-center font-bold text-[14px] text-navy bg-[image:var(--g-primary)] py-1">' + badge + '</p>' +
              '<div class="bg-[#e7e7e7] rounded-b-[28px] p-4"><h3 class="text-black text-[12px] font-semibold">' + p.title[loc] + '</h3></div>' +
              '</div>'
            );
          }).join('') + '</div>' +
          (visible.length < list.length ? '<div class="flex justify-center mt-7"><button type="button" class="border-gradient-mask !py-2.5 !px-8 !font-bold !bg-transparent" data-promo-more><span class="text-gradient" data-i18n="common.readMore">' + W.t('common.readMore') + '</span></button></div>' : '');
          W.qsa('[data-promo-card]', gridEl).forEach(function (el) {
            W.on(el, 'click', function () {
              location.href = 'promotion-detail.html?id=' + visible[Number(el.getAttribute('data-promo-card'))].promotion_id;
            });
          });
          W.on(W.qs('[data-promo-more]', gridEl), 'click', function () {
            visibleCount += PAGE_SIZE;
            renderGrid();
          });
        }

        renderCategories();
        renderGrid();
      };
    </script>
  </body>
</html>
