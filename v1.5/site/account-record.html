<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 max-xl:[body.is-usercenter_&]:pt-0 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>
      <main class="pt-0">
        <div data-mount="user-navbar"></div>
        <div class="grid grid-cols-1">
          <div data-mount="user-sidebar"></div>
          <div class="w-full bg-white overflow-x-hidden xl:ml-[260px] xl:w-[calc(100%-260px)]">
            <div class="bg-[#f2f2f2] min-h-[calc(100vh-var(--header-h-mobile))] flex flex-col xl:min-h-[calc(100vh-var(--header-h-desktop))]">
              <h1 class="hidden xl:block xl:h-[62px] xl:bg-white xl:text-navy xl:text-[32px] xl:font-bold xl:leading-[64px] xl:border-b xl:border-border xl:px-8 xl:mt-0 xl:mx-0 xl:mb-4" data-i18n="userCenter.sidebar.accountRecord">계정 기록</h1>
              <div class="max-w-[1190px] w-full mx-auto px-4 pt-3 pb-24 flex flex-col flex-1 xl:px-8 xl:pt-6 xl:pb-10">
                <div class="flex flex-wrap gap-2 items-center">
                  <div class="relative">
                    <button type="button" class="h-10 !px-3 rounded-lg !bg-white !border !border-border !text-navy !text-[14px] whitespace-nowrap" data-toggle-status>
                      <span data-i18n="userCenter.common.tags.status">상태</span><span data-status-text></span>
                    </button>
                    <div class="hidden flex-col absolute left-0 top-full min-w-[180px] bg-white border border-border rounded-lg mt-1 overflow-hidden shadow-[0_12px_24px_rgba(0,0,0,0.12)] z-50 [&.is-open]:flex" data-status-panel>
                      <button type="button" class="w-full text-left !py-2.5 !px-4 !text-navy !text-[14px] !border-b !border-border last:!border-b-0 hover:!bg-[#f6f6f6] [&.is-active]:!bg-[#fff3d6] [&.is-active]:!font-bold is-active" data-status-value="" data-i18n="userCenter.common.selectList.all">전체</button>
                      <button type="button" class="w-full text-left !py-2.5 !px-4 !text-navy !text-[14px] !border-b !border-border last:!border-b-0 hover:!bg-[#f6f6f6] [&.is-active]:!bg-[#fff3d6] [&.is-active]:!font-bold" data-status-value="Deposit" data-i18n="userCenter.deposit">입금</button>
                      <button type="button" class="w-full text-left !py-2.5 !px-4 !text-navy !text-[14px] !border-b !border-border last:!border-b-0 hover:!bg-[#f6f6f6] [&.is-active]:!bg-[#fff3d6] [&.is-active]:!font-bold" data-status-value="Withdrawal" data-i18n="userCenter.withdrawal">출금</button>
                      <button type="button" class="w-full text-left !py-2.5 !px-4 !text-navy !text-[14px] !border-b !border-border last:!border-b-0 hover:!bg-[#f6f6f6] [&.is-active]:!bg-[#fff3d6] [&.is-active]:!font-bold" data-status-value="Game" data-i18n="userCenter.common.headers.game">게임</button>
                      <button type="button" class="w-full text-left !py-2.5 !px-4 !text-navy !text-[14px] !border-b !border-border last:!border-b-0 hover:!bg-[#f6f6f6] [&.is-active]:!bg-[#fff3d6] [&.is-active]:!font-bold" data-status-value="Bonus" data-i18n="navbar.bottom.bonus">보너스</button>
                    </div>
                  </div>
                  <button type="button" class="h-10 !px-3 rounded-lg !bg-white !border !border-border !text-navy !text-[14px] whitespace-nowrap" data-record-date-btn>2026-08-01 ~ 2026-08-12</button>
                  <button type="button" class="h-10 !px-4 rounded-lg !bg-navy !text-white !font-bold whitespace-nowrap" data-i18n="common.confirm">확인</button>
                </div>

                <div class="mt-4 overflow-x-auto">
                  <table class="w-full min-w-0 border-collapse bg-white rounded-[10px] overflow-hidden text-[12px] text-center xl:hidden">
                    <thead>
                      <tr class="bg-[#f6e27b] text-navy font-bold">
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.transactionType">거래 유형</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.time">시간</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.transactionAmount">거래 금액</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.transactionNo">거래 번호</th>
                      </tr>
                    </thead>
                    <tbody data-record-body-mobile></tbody>
                  </table>

                  <table class="hidden w-full min-w-[700px] border-collapse bg-white rounded-[10px] overflow-hidden text-[13px] text-center xl:table">
                    <thead>
                      <tr class="bg-[#f6e27b] text-navy font-bold">
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.transactionType">거래 유형</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.time">시간</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.transactionAmount">거래 금액</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.currentBalance">현재 잔액</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.transactionNo">거래 번호</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.content">내용</th>
                      </tr>
                    </thead>
                    <tbody data-record-body-desktop></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        function fmt(n) { return Number(n).toLocaleString('en-US'); }
        var STATUS_COLOR = { Approved: '#1dbf73', Reject: '#e11d48', Pending: '#d19200' };
        function statusStyle(s) { return 'color:' + (STATUS_COLOR[s] || STATUS_COLOR.Pending); }
        var TYPE_KEYS = { Deposit: 'userCenter.deposit', Withdrawal: 'userCenter.withdrawal', Game: 'userCenter.common.headers.game', Bonus: 'navbar.bottom.bonus' };
        function typeText(ty) { return W.t(TYPE_KEYS[ty] || ''); }
        function statusText(s) { return W.t(s === 'Approved' ? 'userCenter.common.selectList.approved' : s === 'Reject' ? 'userCenter.common.selectList.rejected' : 'userCenter.common.selectList.pending'); }
        var currentType = '';
        var TD_CLS = 'py-3 px-2 whitespace-nowrap';
        var TR_CLS = 'border-b border-border text-navy last:border-b-0';

        function render() {
          var rows = D.ACCOUNT_RECORDS.filter(function (r) { return !currentType || r.type === currentType; });
          W.qs('[data-record-body-mobile]').innerHTML = rows.map(function (r) {
            return '<tr class="' + TR_CLS + '"><td class="' + TD_CLS + '">' + typeText(r.type) + '</td><td class="' + TD_CLS + '">' + r.time + '</td><td class="' + TD_CLS + '">' + fmt(r.amount) + '</td><td class="' + TD_CLS + ' font-bold" style="' + statusStyle(r.status) + '">' + statusText(r.status) + '</td></tr>';
          }).join('');
          W.qs('[data-record-body-desktop]').innerHTML = rows.map(function (r) {
            return '<tr class="' + TR_CLS + '"><td class="' + TD_CLS + '">' + typeText(r.type) + '</td><td class="' + TD_CLS + '">' + r.time + '</td><td class="' + TD_CLS + '">' + fmt(r.amount) + '</td><td class="' + TD_CLS + '">' + fmt(r.balance) + '</td><td class="' + TD_CLS + '">' + r.no + '</td><td class="' + TD_CLS + ' font-bold" style="' + statusStyle(r.status) + '">' + statusText(r.status) + '</td></tr>';
          }).join('');
        }

        var panel = W.qs('[data-status-panel]');
        W.on(W.qs('[data-toggle-status]'), 'click', function () { panel.classList.toggle('is-open'); });
        /* 對照設計稿:「상태」按鈕永遠要顯示目前選取的選項(含「전체」),
           不是只有選了特定類型才補上文字 */
        W.qs('[data-status-text]').textContent = '： ' + W.qs('[data-status-value].is-active').textContent;
        W.qsa('[data-status-value]').forEach(function (btn) {
          W.on(btn, 'click', function () {
            currentType = btn.getAttribute('data-status-value');
            W.qsa('[data-status-value]').forEach(function (b) { b.classList.remove('is-active'); });
            btn.classList.add('is-active');
            W.qs('[data-status-text]').textContent = '： ' + btn.textContent;
            panel.classList.remove('is-open');
            render();
          });
        });

        render();
        W.initDateRangePicker(W.qs('[data-record-date-btn]'));
        W.on(document, 'win15:localechange', render);
      };
    </script>
  </body>
</html>
