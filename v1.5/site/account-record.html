<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_前台_v1.5</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <div class="page-shell">
      <div data-mount="header"></div>
      <main class="usercenter-main">
        <div data-mount="user-navbar"></div>
        <div class="usercenter-grid">
          <div data-mount="user-sidebar"></div>
          <div class="usercenter-content">
            <div class="record-page">
              <div class="record-inner">
                <div class="record-tags">
                  <button type="button" class="record-status-btn" data-toggle-status>
                    <span data-i18n="userCenter.common.tags.status">상태</span><span data-status-text></span>
                  </button>
                  <button type="button" class="record-date-btn">2026-08-01 ~ 2026-08-12</button>
                  <button type="button" class="record-confirm-btn" data-i18n="common.confirm">확인</button>
                </div>
                <div class="record-status-panel" data-status-panel>
                  <button type="button" class="is-active" data-status-value="">전체</button>
                  <button type="button" data-status-value="Deposit">입금</button>
                  <button type="button" data-status-value="Withdrawal">출금</button>
                  <button type="button" data-status-value="Game">게임</button>
                  <button type="button" data-status-value="Bonus">보너스</button>
                </div>

                <div class="record-table-wrap">
                  <table class="record-table record-mobile-only record-mobile-table">
                    <thead>
                      <tr>
                        <th data-i18n="userCenter.common.headers.transactionType">거래 유형</th>
                        <th data-i18n="userCenter.common.headers.time">시간</th>
                        <th data-i18n="userCenter.common.headers.transactionAmount">거래 금액</th>
                        <th data-i18n="userCenter.common.headers.transactionNo">거래 번호</th>
                      </tr>
                    </thead>
                    <tbody data-record-body-mobile></tbody>
                  </table>

                  <table class="record-table record-desktop-only">
                    <thead>
                      <tr>
                        <th data-i18n="userCenter.common.headers.transactionType">거래 유형</th>
                        <th data-i18n="userCenter.common.headers.time">시간</th>
                        <th data-i18n="userCenter.common.headers.transactionAmount">거래 금액</th>
                        <th data-i18n="userCenter.common.headers.currentBalance">현재 잔액</th>
                        <th data-i18n="userCenter.common.headers.transactionNo">거래 번호</th>
                        <th data-i18n="userCenter.common.headers.content">내용</th>
                      </tr>
                    </thead>
                    <tbody data-record-body-desktop></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/site.js"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        function fmt(n) { return Number(n).toLocaleString('en-US'); }
        function statusClass(s) { return s === 'Approved' ? 'status-text-approved' : s === 'Reject' ? 'status-text-reject' : 'status-text-pending'; }
        var currentType = '';

        function render() {
          var rows = D.ACCOUNT_RECORDS.filter(function (r) { return !currentType || r.type === currentType; });
          W.qs('[data-record-body-mobile]').innerHTML = rows.map(function (r) {
            return '<tr><td>' + r.type + '</td><td>' + r.time + '</td><td>' + fmt(r.amount) + '</td><td class="' + statusClass(r.status) + '">' + r.status + '</td></tr>';
          }).join('');
          W.qs('[data-record-body-desktop]').innerHTML = rows.map(function (r) {
            return '<tr><td>' + r.type + '</td><td>' + r.time + '</td><td>' + fmt(r.amount) + '</td><td>' + fmt(r.balance) + '</td><td>' + r.no + '</td><td class="' + statusClass(r.status) + '">' + r.status + '</td></tr>';
          }).join('');
        }

        var panel = W.qs('[data-status-panel]');
        W.on(W.qs('[data-toggle-status]'), 'click', function () { panel.classList.toggle('is-open'); });
        W.qsa('[data-status-value]').forEach(function (btn) {
          W.on(btn, 'click', function () {
            currentType = btn.getAttribute('data-status-value');
            W.qsa('[data-status-value]').forEach(function (b) { b.classList.remove('is-active'); });
            btn.classList.add('is-active');
            W.qs('[data-status-text]').textContent = currentType ? '： ' + btn.textContent : '';
            panel.classList.remove('is-open');
            render();
          });
        });

        render();
      };
    </script>
  </body>
</html>
