<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 max-xl:[body.is-usercenter_&]:pt-0 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>
      <main class="pt-0">
        <div data-mount="user-navbar"></div>
        <div class="grid grid-cols-1">
          <div data-mount="user-sidebar"></div>
          <div class="w-full bg-white overflow-x-hidden xl:ml-[260px] xl:w-[calc(100%-260px)]">
            <h1 class="hidden xl:block xl:m-0 xl:h-[62px] xl:text-navy xl:text-[32px] xl:font-bold xl:py-2 xl:px-8 xl:border-b xl:border-border-soft" data-tx-title>거래 상세</h1>
            <section class="pt-6 px-7 pb-25 xl:py-8">
              <div class="max-w-[945px] mx-auto">
                <span class="block w-fit mx-auto mb-10 py-1 px-6 rounded-full bg-navy-2 text-white" data-i18n="userCenter.transactionDetails">거래 상세</span>
                <div class="border border-border rounded-xl pt-3 px-6 pb-0">
                  <div class="flex items-center justify-between pb-4">
                    <span class="text-[14px] font-bold text-navy" data-tx-amount-label>입금 금액</span>
                    <span class="text-[24px] font-bold text-navy">₩ <span data-tx-amount>0</span></span>
                  </div>
                  <div class="flex items-center justify-between pb-4 border-b border-border-soft" data-tx-bonus-row style="display: none">
                    <span class="text-[14px] font-bold text-navy" data-tx-bonus-label>입금 프로모션</span>
                    <span class="text-[16px] font-bold text-[#0e8d6c]">＋₩ <span data-tx-bonus>0</span> <span data-i18n="userCenter.bonus">보너스</span></span>
                  </div>
                  <div class="flex items-center justify-between pb-4" data-tx-received-row style="display: none">
                    <span class="text-[14px] font-bold text-navy" data-i18n="userCenter.receivedAmount">실수령 금액</span>
                    <span class="text-[24px] font-bold text-navy">₩ <span data-tx-received>0</span></span>
                  </div>
                </div>

                <div class="flex items-center justify-between py-6 px-4">
                  <span class="text-navy font-bold" data-tx-account-label>입금 계좌</span>
                  <span class="text-navy font-bold" data-tx-username>meaomcao</span>
                </div>

                <p class="text-[#4f4f4f] px-4 mt-4" data-tx-desc></p>
                <a class="inline-block mt-6 px-4 !text-[#1d4ed8] !underline" href="#" data-i18n="userCenter.customerService">고객센터</a>

                <div class="mt-16">
                  <button type="button" class="w-full h-12 rounded-lg !bg-navy !font-bold" data-tx-complete>
                    <span class="text-gradient" data-i18n="common.complete">완료</span>
                  </button>
                  <button type="button" class="w-full h-12 mt-4 rounded-lg !border !border-navy !text-navy !font-bold !bg-white" data-tx-back data-i18n="common.back">뒤로</button>
                </div>
              </div>
            </section>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        var params = new URLSearchParams(location.search);
        var type = params.get('type') || 'deposit';
        var amount = Number((params.get('amount') || '0').replace(/,/g, '')) || 0;
        var bonus = Number((params.get('bonus') || '0').replace(/,/g, '')) || 0;
        var isWithdrawal = type === 'withdrawal';

        document.querySelector('[data-tx-title]').textContent = isWithdrawal ? W.t('userCenter.withdrawal') : W.t('userCenter.deposit');
        W.qs('[data-tx-amount-label]').textContent = isWithdrawal ? W.t('userCenter.withdrawalAmount') : W.t('userCenter.depositAmount');
        W.qs('[data-tx-amount]').textContent = amount.toLocaleString('en-US');
        W.qs('[data-tx-account-label]').textContent = isWithdrawal ? W.t('userCenter.withdrawalAccount') : W.t('userCenter.depositAccount');
        W.qs('[data-tx-username]').textContent = D.MOCK_PROFILE.username;
        W.qs('[data-tx-desc]').textContent = W.t('userCenter.transactionDescription').replace('{action}', isWithdrawal ? W.t('common.completeWithdrawal') : W.t('common.completeDeposit'));

        if (!isWithdrawal && bonus > 0) {
          W.qs('[data-tx-bonus-row]').style.display = 'flex';
          W.qs('[data-tx-bonus-label]').textContent = W.t('userCenter.depositPromotions');
          W.qs('[data-tx-bonus]').textContent = bonus.toLocaleString('en-US');
          W.qs('[data-tx-received-row]').style.display = 'flex';
          W.qs('[data-tx-received]').textContent = (amount + bonus).toLocaleString('en-US');
        }

        W.on(W.qs('[data-tx-back]'), 'click', function () { history.back(); });
        W.on(W.qs('[data-tx-complete]'), 'click', function () {
          W.showAlert({
            type: 'success',
            message: isWithdrawal ? W.t('common.withdrawalSuccess') : W.t('common.depositSuccess'),
            redirectUrl: isWithdrawal ? 'withdrawal-record.html' : 'deposit-record.html',
          });
        });
      };
    </script>
  </body>
</html>
