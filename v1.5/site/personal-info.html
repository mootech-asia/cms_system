<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 max-xl:[body.is-usercenter_&]:pt-0 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>
      <main class="pt-0">
        <div data-mount="user-navbar"></div>
        <div class="grid grid-cols-1">
          <div data-mount="user-sidebar"></div>
          <div class="w-full bg-white overflow-x-hidden xl:ml-[260px] xl:w-[calc(100%-260px)]">
            <div class="bg-white px-4 pt-4 pb-25 xl:px-8 xl:pt-6 xl:pb-10">
              <h1 class="hidden xl:block xl:m-0 xl:text-navy xl:text-[32px] xl:font-bold xl:pt-4 xl:px-8 xl:pb-2 xl:border-b xl:border-border-soft" data-i18n="userCenter.sidebar.personalInfo">개인 정보</h1>
              <div class="max-w-[945px] mx-auto">
                <p class="text-navy-2 font-bold text-[16px]"><span data-i18n="userCenter.personalInfoPage.username">사용자명</span> : <span data-pi-username>meaomcao</span></p>

                <div class="relative mt-4">
                  <img class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4" src="assets/images/icon/usercenter/personal.svg" alt="user" />
                  <input type="text" class="w-full h-10 rounded-lg border border-navy-2 pl-9 pr-3 text-navy flex items-center" data-nickname-input placeholder="닉네임을 입력해 주세요" data-i18n-placeholder="userCenter.personalInfoPage.nicknamePlaceholder" />
                </div>

                <div class="relative mt-4">
                  <img class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 z-[1]" src="assets/images/icon/usercenter/birthday.svg" alt="birthday" />
                  <input type="text" class="w-full h-10 rounded-lg border border-navy-2 pl-9 pr-3 text-navy flex items-center" value="2000-01-01" />
                </div>

                <div class="w-full h-10 rounded-lg bg-[#d9d9d9] pl-9 pr-3 text-[#6d6d6d] text-[14px] flex items-center gap-2 mt-4">
                  <img class="w-4 h-4" src="assets/images/icon/usercenter/mail.svg" alt="mail" />
                  <span>meaomcao@example.com</span>
                </div>
                <div class="w-full h-10 rounded-lg bg-[#d9d9d9] pl-9 pr-3 text-[#6d6d6d] text-[14px] flex items-center gap-2 mt-4">
                  <img class="w-4 h-4" src="assets/images/icon/usercenter/id.svg" alt="id" />
                  <span>MEAOMCAO</span>
                </div>

                <div class="grid grid-cols-[130px_1fr] gap-2 mt-4">
                  <div class="w-full h-10 rounded-lg bg-[#d9d9d9] pl-9 pr-3 text-[#6d6d6d] text-[14px] flex items-center gap-2 mt-4"><span>🇰🇷</span><span>+82</span></div>
                  <div class="w-full h-10 rounded-lg bg-[#d9d9d9] pl-9 pr-3 text-[#6d6d6d] text-[14px] flex items-center gap-2 mt-4">
                    <img class="w-3.5 h-3.5" src="assets/images/icon/usercenter/personal.svg" alt="phone" />
                    <span>10-1234-5678</span>
                  </div>
                </div>

                <div class="text-center mt-10">
                  <span class="inline-block py-1 px-6 rounded-full bg-navy-2 text-white" data-i18n="userCenter.personalInfoPage.privacyCta">개인 정보 보호에 최선을 다합니다</span>
                  <p class="text-navy mt-4" data-i18n="userCenter.personalInfoPage.privacyNoteLine1">모든 사용자 데이터는 암호화되어 개인 정보가 안전하게 보호됩니다.</p>
                  <p class="text-navy mt-4" data-i18n="userCenter.personalInfoPage.privacyNoteLine2">개인 정보 수정이 필요한 경우 고객센터로 문의해 주세요.</p>
                </div>

                <div class="mt-13 max-xl:fixed max-xl:inset-x-0 max-xl:bottom-0 max-xl:z-20 max-xl:mt-0">
                  <button type="button" class="w-full h-[51px] flex items-center justify-center rounded-[10px] !bg-navy-2 !font-bold" data-pi-submit><span class="text-gradient" data-i18n="userCenter.personalInfoPage.submit">제출</span></button>
                  <button type="button" class="w-full h-12 mt-2 rounded-lg !border !border-navy !text-navy !font-bold !bg-white" data-nav-href="account.html" data-i18n="common.back">뒤로</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        var p = D.MOCK_PROFILE;
        W.qs('[data-pi-username]').textContent = p.username;
        W.qs('[data-nickname-input]').value = p.nickname;
        W.on(W.qs('[data-pi-submit]'), 'click', function () {
          W.showAlert({ type: 'success', message: W.t('common.profileUpdateSuccess') || '프로필이 성공적으로 업데이트되었습니다.' });
        });
      };
    </script>
  </body>
</html>
