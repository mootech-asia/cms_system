<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_前台_v1.5</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <div class="page-shell">
      <div data-mount="header"></div>
      <main class="usercenter-main">
        <div data-mount="user-navbar"></div>
        <div class="usercenter-grid">
          <div data-mount="user-sidebar"></div>
          <div class="usercenter-content">
            <div class="pay-page">
              <h1 class="pay-page-title" data-i18n="userCenter.withdrawal">출금</h1>
              <section class="pay-section">
                <div class="pay-section-inner">
                  <div class="wd-card-nav">
                    <span data-i18n="userCenter.withdrawalPage.myBankAccounts">나의 은행 계좌</span>
                  </div>

                  <div class="wd-empty">
                    <img src="assets/images/userCenter/bankcard.png" alt="empty" />
                    <p data-i18n="userCenter.withdrawalPage.emptyBankAccount">등록된 계좌가 없습니다</p>
                    <button type="button" data-nav-href="banking-details.html" data-i18n="userCenter.withdrawalPage.addAccount">계좌 추가</button>
                  </div>

                  <div class="wd-refresh-row">
                    <button type="button" data-refresh-profile>
                      <svg viewBox="0 0 24 24" style="width: 18px; height: 18px"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></g></svg>
                      <span data-i18n="userCenter.withdrawalPage.refresh">새로고침</span>
                    </button>
                  </div>

                  <div class="wd-wallet-row">
                    <div>
                      <p class="wallet-label"><span data-i18n="userCenter.withdrawalPage.main">메인</span> <span data-i18n="userCenter.withdrawalPage.wallet">지갑</span></p>
                      <p class="wallet-amount">₩ <span data-profile-wallet>0.00</span></p>
                    </div>
                  </div>
                  <p class="wd-turnover-note">
                    <span data-i18n="userCenter.withdrawalPage.remainingTurnoverAmount">*남은 유효 베팅 금액: ₩ </span><span data-profile-turnover>0</span>
                    <a class="detail-btn" href="withdrawal-detail.html" data-i18n="common.detail">상세 정보</a>
                  </p>

                  <div style="text-align: center">
                    <span class="pay-pill-label" style="margin-top: 32px" data-i18n="userCenter.withdrawalPage.withdrawalAmountAndPassword">출금 금액 및 비밀번호</span>
                  </div>
                  <input type="text" inputmode="numeric" class="pay-input" data-amount-input placeholder="₩ 10,000 ~ ₩ 9,000,000" />
                  <div class="pw-input-wrap">
                    <input type="password" class="pay-input" data-password-input placeholder="Please Enter Transaction Password" />
                    <button type="button" class="pw-toggle" data-toggle-pwd><img src="assets/images/icon/eye.svg" alt="toggle" data-pwd-icon /></button>
                  </div>
                  <p class="pay-note" data-rollover-note></p>

                  <button type="button" class="pay-next-btn" data-withdrawal-submit disabled>
                    <span class="text-gradient" data-i18n="common.submit">제출</span>
                  </button>
                  <button type="button" class="pay-back-btn" data-nav-href="account.html" data-i18n="common.back">뒤로</button>
                </div>
              </section>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/site.js"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        var MIN = 10000, MAX = 9000000;
        var p = D.MOCK_PROFILE;

        function fmt(n) { return Number(n).toLocaleString('en-US'); }
        W.qs('[data-profile-wallet]').textContent = p.wallet_balance;
        W.qs('[data-profile-turnover]').textContent = p.remaining_turnover_amount;
        W.qs('[data-rollover-note]').textContent = W.t('userCenter.withdrawalPage.rolloverNote')
          .replace('{achieved}', p.rollover_achieved).replace('{target}', p.rollover_target);

        W.on(W.qs('[data-refresh-profile]'), 'click', function () {
          var svg = W.qs('[data-refresh-profile] svg');
          svg.style.transition = 'transform 1s linear';
          svg.style.transform = 'rotate(360deg)';
          setTimeout(function () { svg.style.transform = 'rotate(0deg)'; }, 1000);
        });

        var input = W.qs('[data-amount-input]');
        var pwd = W.qs('[data-password-input]');
        var submitBtn = W.qs('[data-withdrawal-submit]');
        function refreshState() {
          submitBtn.disabled = !(input.value && pwd.value);
        }
        W.on(input, 'input', function () {
          var digits = (input.value || '').replace(/\D/g, '');
          input.value = digits ? fmt(Math.min(Number(digits), MAX)) : '';
          refreshState();
        });
        W.on(pwd, 'input', refreshState);
        W.on(W.qs('[data-toggle-pwd]'), 'click', function () {
          var isPwd = pwd.type === 'password';
          pwd.type = isPwd ? 'text' : 'password';
          W.qs('[data-pwd-icon]').src = isPwd ? W.icon('eye-show.svg') : W.icon('eye.svg');
        });

        W.on(submitBtn, 'click', function () {
          if (submitBtn.disabled) return;
          location.href = 'transaction-info.html?type=withdrawal&amount=' + encodeURIComponent(input.value);
        });
      };
    </script>
  </body>
</html>
