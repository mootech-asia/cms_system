<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_前台_v1.5</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <div class="page-shell">
      <div data-mount="header"></div>

      <main class="home-main">
        <section class="banner">
          <div class="banner-slides" data-banner-slides>
            <div class="banner-slide is-active"><img src="assets/images/banner/banner.jpg" alt="banner" /></div>
            <div class="banner-slide"><img src="assets/images/banner/banner-2.jpg" alt="banner" /></div>
          </div>
          <div class="banner-dots" data-banner-dots>
            <button type="button" class="banner-dot is-active" data-dot-index="0" aria-label="Go to slide 1"></button>
            <button type="button" class="banner-dot" data-dot-index="1" aria-label="Go to slide 2"></button>
          </div>
        </section>

        <section class="home-marquee">
          <div class="home-marquee-viewport">
            <div class="home-marquee-track" data-marquee-track></div>
          </div>
          <div class="home-marquee-clock" data-marquee-clock></div>
        </section>

        <section class="hot-game">
          <div class="hot-game-head">
            <div class="hot-game-title">
              <img src="assets/images/index/game-icon.svg" alt="hot game" />
              <span data-i18n="gameType.types.hotGames">인기 게임</span>
            </div>
            <div class="hot-game-actions">
              <button type="button" data-nav-href="game-type.html?type=hotgames" data-i18n="hotGame.seeAll">전체 보기</button>
              <button type="button" data-hot-game-prev><img class="hot-game-arrow" src="assets/images/icon/arrow-left2.svg" alt="prev" /></button>
              <button type="button" data-hot-game-next><img class="hot-game-arrow" src="assets/images/icon/arrow-right2.svg" alt="next" /></button>
            </div>
          </div>
          <div class="hot-game-strip">
            <div class="hot-game-track" data-hot-game-track></div>
          </div>
        </section>

        <section class="game-type-section">
          <div class="game-type-grid" data-game-type-grid></div>
        </section>

        <section class="home-promotion">
          <div class="home-promotion-grid">
            <div class="home-promotion-card"><img src="assets/images/index/promotion/index.png" alt="promotion" /></div>
            <div class="home-promotion-card"><img src="assets/images/index/promotion/promotion2.png" alt="promotion" /></div>
            <div class="home-promotion-card"><img src="assets/images/index/promotion/promotionDetail.png" alt="promotion" /></div>
          </div>
        </section>
      </main>

      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/site.js"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;

        /* ---- Marquee ---- */
        var track = W.qs('[data-marquee-track]');
        if (track) {
          var itemsHtml = D.MARQUEE_ITEMS.map(function (m) {
            return '<span>✨ ' + m.title + ' ✨</span>';
          }).join('');
          track.innerHTML = itemsHtml + itemsHtml;
        }
        var clock = W.qs('[data-marquee-clock]');
        function updateClock() {
          var d = new Date(Date.now() + 8 * 60 * 60 * 1000);
          function pad(n) { return String(n).padStart(2, '0'); }
          clock.textContent = 'GMT+8 ' + d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
        }
        if (clock) { updateClock(); setInterval(updateClock, 1000); }

        /* ---- Banner ---- */
        var slides = W.qsa('.banner-slide');
        var dots = W.qsa('.banner-dot');
        var bannerActive = 0;
        function showBanner(i) {
          bannerActive = i;
          slides.forEach(function (s, idx) { s.classList.toggle('is-active', idx === i); });
          dots.forEach(function (d, idx) { d.classList.toggle('is-active', idx === i); });
        }
        dots.forEach(function (d, i) { W.on(d, 'click', function () { showBanner(i); }); });
        if (slides.length > 1) {
          setInterval(function () { showBanner((bannerActive + 1) % slides.length); }, 6000);
        }

        /* ---- Hot Game ---- */
        var hgTrack = W.qs('[data-hot-game-track]');
        var hgIndex = 0;
        var hgStep = 331;
        function updateHgStep() {
          hgStep = window.innerWidth >= 1280 ? 465 + 20 : 311 + 20;
        }
        function renderHotGames() {
          hgTrack.innerHTML = D.HOT_GAMES.map(function (g) {
            return (
              '<div class="hot-game-card">' +
              '<div class="hot-game-card-thumb"><img src="assets/images/' + g.image + '" alt="' + g.name + '"></div>' +
              '<div class="hot-game-card-body"><div><span class="hot-game-tag" data-i18n="hotGame.promo">' + W.t('hotGame.promo') + '</span><h3 class="hot-game-name">' + g.name + '</h3></div>' +
              '<button type="button" class="hot-game-play-btn" data-i18n="hotGame.playNow">' + W.t('hotGame.playNow') + '</button></div>' +
              '</div>'
            );
          }).join('');
        }
        function moveHg(delta) {
          var max = Math.max(0, D.HOT_GAMES.length - 1);
          hgIndex = Math.min(max, Math.max(0, hgIndex + delta));
          hgTrack.style.transform = 'translateX(-' + (hgIndex * hgStep) + 'px)';
        }
        updateHgStep();
        renderHotGames();
        W.on(W.qs('[data-hot-game-prev]'), 'click', function () { moveHg(-1); });
        W.on(W.qs('[data-hot-game-next]'), 'click', function () { moveHg(1); });
        window.addEventListener('resize', function () { updateHgStep(); moveHg(0); });

        /* ---- Game Type shortcuts ---- */
        var gtGrid = W.qs('[data-game-type-grid]');
        gtGrid.innerHTML = D.GAME_TYPES.map(function (g) {
          return (
            '<a class="game-type-item" href="game-type.html?type=' + g.key + '">' +
            '<img src="assets/images/index/hotGame/' + g.icon + '" alt="' + g.key + '">' +
            '<span data-i18n="' + g.tKey + '">' + W.t(g.tKey) + '</span>' +
            '</a>'
          );
        }).join('');

        W.applyLocale();
      };
    </script>
  </body>
</html>
