<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 max-xl:[body.is-usercenter_&]:pt-0 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>
      <main class="pt-0">
        <div data-mount="user-navbar"></div>
        <div class="grid grid-cols-1">
          <div data-mount="user-sidebar"></div>
          <div class="w-full bg-white overflow-x-hidden xl:ml-[260px] xl:w-[calc(100%-260px)]">
            <div class="bg-[#f2f2f2] min-h-[calc(100vh-var(--header-h-mobile))] flex flex-col xl:min-h-[calc(100vh-var(--header-h-desktop))]">
              <h1 class="hidden xl:block xl:h-[62px] xl:bg-white xl:text-navy xl:text-[32px] xl:font-bold xl:leading-[64px] xl:border-b xl:border-border xl:px-8 xl:mt-0 xl:mx-0 xl:mb-4" data-i18n="nav.SurvivalSpin">Survival Spin</h1>
              <div class="max-w-[1190px] w-full mx-auto px-4 pt-3 pb-24 flex flex-col flex-1 xl:px-8 xl:pt-6 xl:pb-10">
                <div class="flex flex-col gap-6"><div class="py-4">
            <iframe id="luckyWheelFrame" class="block w-full max-w-120 mx-auto border-0" data-src="../../event/20261111_lucky_wheel/index.html?skin=survival" title="Survival Spin" allow="clipboard-write; web-share; autoplay"></iframe>
          </div>
          <script>
            /* 生存轉盤活動（event/20261111_lucky_wheel）以 H5 寬 iframe 嵌入：
               語系跟著本站 <html lang>（活動只有 en/ko/th，其他語系一律帶 en），
               高度填滿視窗扣掉頂部列與底部固定列，活動在 iframe 內自己捲動 */
            (function () {
              var frame = document.getElementById('luckyWheelFrame');
              var base = frame.getAttribute('data-src');
              function lang() {
                var l = (document.documentElement.getAttribute('lang') || 'en').slice(0, 2).toLowerCase();
                return l === 'ko' || l === 'th' ? l : 'en';
              }
              function load() {
                var url = base + '&lang=' + lang();
                if (frame.getAttribute('src') !== url) frame.setAttribute('src', url);
              }
              function bottomBar() {
                var h = 0;
                document.querySelectorAll('body *').forEach(function (el) {
                  if (el === frame || el.contains(frame)) return;
                  var cs = getComputedStyle(el);
                  if (cs.position !== 'fixed' || cs.display === 'none' || cs.visibility === 'hidden') return;
                  var r = el.getBoundingClientRect();
                  if (r.height > 0 && r.height < 140 && r.bottom >= window.innerHeight - 1 && r.top > window.innerHeight / 2 && r.width > window.innerWidth / 2) h = Math.max(h, r.height);
                });
                return h;
              }
              // 手機寬度時撐滿螢幕左右（有些站的內容區在右側預留浮動客服欄的位置），桌機維持置中 H5 寬
              function bleed() {
                var wrap = frame.parentElement;
                wrap.style.marginLeft = wrap.style.marginRight = '';
                if (window.innerWidth > 768) return;
                var w = wrap.getBoundingClientRect();
                var vw = document.documentElement.clientWidth;
                wrap.style.marginLeft = (-w.left) + 'px';
                wrap.style.marginRight = (w.right - vw) + 'px';
              }
              function fit() {
                bleed();
                var top = frame.getBoundingClientRect().top + window.pageYOffset;
                frame.style.height = Math.max(520, window.innerHeight - top - bottomBar() - 16) + 'px';
              }
              load();
              fit();
              window.addEventListener('resize', fit);
              window.addEventListener('load', fit);
              new MutationObserver(load).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
            })();
          </script>
</div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    
  </body>
</html>
