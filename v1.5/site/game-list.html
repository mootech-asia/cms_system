<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>

      <main class="bg-navy min-h-[60vh] px-5 py-6 xl:px-24 xl:py-16">
        <a class="flex items-center gap-1.5 !text-white font-bold mb-4" data-gl-back href="game-type.html">
          <img src="assets/images/icon/back-white.svg" alt="back" class="w-4 h-4" />
          <span data-i18n="common.back">뒤로</span>
        </a>

        <div class="flex items-center gap-2 mb-1">
          <span class="text-gradient text-[20px] font-bold xl:text-[28px]" data-gl-title></span>
          <div class="w-px h-4 bg-[#b0b0b0]"></div>
          <span class="text-[#b0b0b0] font-bold" data-gl-vendor></span>
        </div>
        <div class="flex flex-col gap-4 justify-between mt-4 md:flex-row md:items-end">
          <div class="flex md:flex-none" data-gl-tabs></div>
          <form class="flex items-center gap-2 md:ml-auto" data-gl-search-form>
            <input type="text" class="flex-1 h-10 rounded-lg bg-[#1e1e1e] border border-white/10 text-white px-4 !text-[14px] placeholder:text-[#e7e7e7] md:w-72" data-gl-search-input />
            <button type="submit" class="border-gradient-mask shrink-0 flex items-center !py-2 !px-3 !font-bold">
              <img src="assets/images/icon/search-gradient.svg" alt="search" class="w-[18px] h-[18px] mr-1" />
              <span class="text-gradient" data-i18n="common.search">검색</span>
            </button>
          </form>
        </div>

        <div data-gl-body></div>
      </main>

      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        var PAGE_SIZE = 12;
        /* main.css 的 button{border:0;padding:0;...} 只重置 border-width/
           style/color,不影響 border-image/border-image-slice,所以
           is-active 的漸層底線不用加 !,但 base 的 border-b 本身要加 */
        var GL_TAB_CLS = 'flex-1 text-center !py-2 !px-4 !font-bold !text-white !border-b !border-[#4f4f4f] whitespace-nowrap md:flex-none [&.is-active]:[border-image:var(--g-primary)] [&.is-active]:[border-image-slice:1]';

        var TITLE_KEYS = {
          mini_game: 'gameType.types.miniGames',
          slot: 'gameType.types.slots',
          fish: 'gameType.types.fish',
        };

        var params = new URLSearchParams(location.search);
        var type = params.get('type') || 'slot';
        var vendor = params.get('vendor') || '';
        var activeOption = 'all';
        var query = '';
        var visibleCount = PAGE_SIZE;

        W.qs('[data-gl-back]').setAttribute('href', 'game-type.html?type=' + type);
        W.qs('[data-gl-title]').textContent = W.t(TITLE_KEYS[type] || '');
        W.qs('[data-gl-vendor]').textContent = vendor;

        var tabsEl = W.qs('[data-gl-tabs]');
        var bodyEl = W.qs('[data-gl-body]');
        var searchInput = W.qs('[data-gl-search-input]');
        searchInput.placeholder = W.t('common.gameName');

        function pool() {
          return (D.FLAT_GAMES[type] || []).filter(function (g) { return g.provider === vendor; });
        }

        function renderTabs() {
          var opts = [
            { id: 'all', label: W.t('gameList.options.all') },
            { id: 'favorite', label: W.t('gameList.options.favorite') },
          ];
          tabsEl.innerHTML = opts.map(function (o) {
            return '<button type="button" class="' + GL_TAB_CLS + (o.id === activeOption ? ' is-active' : '') +
              '" data-gl-option="' + o.id + '"><span class="' + (o.id === activeOption ? 'text-gradient' : '') + '">' + o.label + '</span></button>';
          }).join('');
          W.qsa('[data-gl-option]', tabsEl).forEach(function (btn) {
            W.on(btn, 'click', function () {
              activeOption = btn.getAttribute('data-gl-option');
              visibleCount = PAGE_SIZE;
              renderTabs();
              renderBody();
            });
          });
        }

        function renderBody() {
          var games = pool().filter(function (g) {
            if (activeOption === 'favorite' && !g.isFavorite) return false;
            if (query && g.display_name.toLowerCase().indexOf(query) === -1) return false;
            return true;
          });
          if (!games.length) {
            bodyEl.innerHTML = '<div class="py-16 text-center text-white/60 text-[14px]" data-i18n="common.noData">' + W.t('common.noData') + '</div>';
            return;
          }
          var visible = games.slice(0, visibleCount);
          bodyEl.innerHTML = '<div class="grid grid-cols-[repeat(3,1fr)] gap-4 mt-7 md:grid-cols-[repeat(6,1fr)] 2xl:grid-cols-[repeat(7,1fr)]">' + visible.map(function (g, idx) {
            return (
              '<div class="group cursor-pointer" data-gl-game="' + idx + '">' +
              '<div class="relative rounded-2xl overflow-hidden shadow-[inset_0_0_0_1px_rgba(255,255,255,0.1)] bg-[#0b1733]"><img src="assets/images/' + g.desktop_icon_url + '" alt="' + g.display_name + '" class="w-full aspect-square object-cover transition-transform duration-1000 ease-out group-hover:scale-[1.15]"></div>' +
              '<div class="pt-2 px-1 pb-0"><p class="text-white font-bold text-[13px] whitespace-nowrap overflow-hidden text-ellipsis xl:text-[18px]">' + g.display_name + '</p>' +
              '<div class="flex items-center justify-between mt-0.5"><span class="text-white/60 text-[12px] whitespace-nowrap overflow-hidden text-ellipsis">' + g.provider + '</span>' +
              '<button type="button" class="shrink-0 w-4 h-4" data-gl-fav="' + idx + '"><img src="assets/images/icon/' + (g.isFavorite ? 'like-fill.svg' : 'like.svg') + '" alt="fav" class="w-full h-full"></button>' +
              '</div></div></div>'
            );
          }).join('') + '</div>' +
          (visible.length < games.length ? '<div class="flex justify-center mt-7"><button type="button" class="border-gradient-mask !py-2.5 !px-8 !font-bold !bg-transparent" data-gl-more><span class="text-gradient" data-i18n="common.readMore">' + W.t('common.readMore') + '</span></button></div>' : '');
          W.qsa('[data-gl-fav]', bodyEl).forEach(function (btn) {
            W.on(btn, 'click', function (e) {
              e.stopPropagation();
              var g = visible[Number(btn.getAttribute('data-gl-fav'))];
              g.isFavorite = !g.isFavorite;
              renderBody();
            });
          });
          W.qsa('[data-gl-game]', bodyEl).forEach(function (el) {
            W.on(el, 'click', function () { W.showAlert({ type: 'success', message: W.t('common.openingGame') }); });
          });
          W.on(W.qs('[data-gl-more]', bodyEl), 'click', function () {
            visibleCount += PAGE_SIZE;
            renderBody();
          });
        }

        W.on(W.qs('[data-gl-search-form]'), 'submit', function (e) {
          e.preventDefault();
          query = (searchInput.value || '').trim().toLowerCase();
          visibleCount = PAGE_SIZE;
          renderBody();
        });

        renderTabs();
        renderBody();
      };
    </script>
  </body>
</html>
