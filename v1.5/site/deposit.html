<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_前台_v1.5</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/css/main.css?v=8" />
  </head>
  <body>
    <div class="page-shell">
      <div data-mount="header"></div>
      <main class="usercenter-main">
        <div data-mount="user-navbar"></div>
        <div class="usercenter-grid">
          <div data-mount="user-sidebar"></div>
          <div class="usercenter-content">
            <div class="pay-page">
              <h1 class="pay-page-title" data-i18n="userCenter.deposit">입금</h1>
              <section class="pay-section">
                <div class="pay-section-inner">
                  <div class="pay-channel-tabs" data-channel-tabs>
                    <button type="button" class="pay-channel-tab is-active" data-channel="A" data-i18n="userCenter.depositPage.channelA">채널 A</button>
                    <button type="button" class="pay-channel-tab" data-channel="B" data-i18n="userCenter.depositPage.channelB">채널 B</button>
                    <button type="button" class="pay-channel-tab" data-channel="C" data-i18n="userCenter.depositPage.channelC">채널 C</button>
                    <button type="button" class="pay-channel-tab" data-channel="D" data-i18n="userCenter.depositPage.channelD">채널 D</button>
                  </div>

                  <!-- 對照 v2 真實原始碼(.payment-tabs):通道分頁下面還有一層
                       付款方式分頁,兩者是各自獨立的分頁層級 -->
                  <div class="pay-method-tabs" data-dp-method>
                    <button type="button" class="pay-method-tab is-selected" data-dp-method-btn="bank" data-i18n="userCenter.withdrawalPage.bankCard">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path><path d="M7 15h4"></path></svg>은행카드
                    </button>
                    <button type="button" class="pay-method-tab" data-dp-method-btn="linepay">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>LinePay
                    </button>
                    <button type="button" class="pay-method-tab" data-dp-method-btn="trc20">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 8h3.8a2.2 2.2 0 0 1 0 4.4H9.5z"></path><path d="M9.5 12.4h4.2a2.3 2.3 0 0 1 0 4.6H9.5z"></path><path d="M9.5 6v12M11 4.5V6M14 4.5V6M11 18v1.5M14 18v1.5"></path></svg>USDT-TRC20
                    </button>
                    <button type="button" class="pay-method-tab" data-dp-method-btn="erc20">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 8h3.8a2.2 2.2 0 0 1 0 4.4H9.5z"></path><path d="M9.5 12.4h4.2a2.3 2.3 0 0 1 0 4.6H9.5z"></path><path d="M9.5 6v12M11 4.5V6M14 4.5V6M11 18v1.5M14 18v1.5"></path></svg>USDT-ERC20
                    </button>
                  </div>

                  <div>
                    <span class="pay-pill-label" data-i18n="userCenter.depositPage.depositAmount">입금 금액</span>
                    <div class="pay-amount-grid" data-amount-grid>
                      <button type="button" class="pay-amount-btn" data-amount="10,000">10,000</button>
                      <button type="button" class="pay-amount-btn" data-amount="50,000">50,000</button>
                      <button type="button" class="pay-amount-btn" data-amount="100,000">100,000</button>
                      <button type="button" class="pay-amount-btn" data-amount="500,000">500,000</button>
                      <button type="button" class="pay-amount-btn" data-amount="1,000,000">1,000,000</button>
                    </div>
                  </div>

                  <input type="text" inputmode="numeric" class="pay-input dp-amount-input" data-amount-input placeholder="₩ 10,000 - 9,000,000" />
                  <p class="pay-note" data-limit-note></p>
                  <p class="pay-note" data-turnover-note></p>

                  <div class="dp-promotion-wrap" data-promotion-wrap>
                    <span class="pay-pill-label" data-i18n="userCenter.depositPage.choosePromotion">프로모션 선택</span>
                    <div data-promotion-list></div>
                  </div>

                  <div class="pay-btn-fixed-wrap">
                    <button type="button" class="pay-next-btn" data-deposit-next disabled>
                      <span class="text-gradient" data-i18n="common.next">다음</span>
                    </button>
                    <button type="button" class="pay-back-btn" data-nav-href="account.html" data-i18n="common.back">뒤로</button>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=8"></script>
    <script src="assets/js/site.js?v=8"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        var MIN = 10000, MAX = 9000000;
        var DEFAULT_AMOUNT = '10,000';
        var selectedPromoIndex = 0;
        var promotions = D.DEPOSIT_PROMOTIONS.concat([{ promotion_id: 'none', nameKey: 'userCenter.depositPage.noPromotion' }]);

        /* 付款通道分頁(채널 A/B/C/D):純前端分組展示,不影響下方付款內容 */
        W.qsa('[data-channel-tabs] [data-channel]').forEach(function (tab) {
          W.on(tab, 'click', function () {
            W.qsa('[data-channel-tabs] [data-channel]').forEach(function (t) { t.classList.toggle('is-active', t === tab); });
          });
        });

        /* 付款方式分頁(銀行卡/LinePay/USDT-TRC20/USDT-ERC20):對照 v2 真實
           原始碼(.payment-tabs),純前端分組展示,不影響下方金額/優惠內容 */
        W.qsa('[data-dp-method] [data-dp-method-btn]').forEach(function (btn) {
          W.on(btn, 'click', function () {
            W.qsa('[data-dp-method] [data-dp-method-btn]').forEach(function (b) { b.classList.toggle('is-selected', b === btn); });
          });
        });

        function fmt(n) { return Number(n).toLocaleString('en-US'); }
        W.qs('[data-limit-note]').textContent = W.t('userCenter.depositPage.limitNote').replace('{min}', fmt(MIN)).replace('{max}', fmt(MAX));
        W.qs('[data-turnover-note]').textContent = W.t('userCenter.withdrawalPage.remainingTurnoverAmount') + D.MOCK_PROFILE.remaining_turnover_amount;

        var input = W.qs('[data-amount-input]');
        var nextBtn = W.qs('[data-deposit-next]');

        function amountNumber() {
          return Number((input.value || '').replace(/\D/g, '')) || 0;
        }
        function refreshNextState() {
          var n = amountNumber();
          nextBtn.disabled = !(n >= MIN && n <= MAX);
        }
        function syncAmountButtons() {
          var raw = (input.value || '').replace(/\D/g, '');
          W.qsa('[data-amount-grid] .pay-amount-btn').forEach(function (b) {
            b.classList.toggle('is-selected', b.getAttribute('data-amount').replace(/\D/g, '') === raw);
          });
        }
        function setAmount(v) {
          input.value = v ? '₩ ' + fmt(Number(String(v).replace(/\D/g, ''))) : '';
          syncAmountButtons();
          refreshNextState();
          renderPromotions();
        }
        W.qsa('[data-amount-grid] .pay-amount-btn').forEach(function (btn) {
          W.on(btn, 'click', function () { setAmount(btn.getAttribute('data-amount')); });
        });
        W.on(input, 'input', function () {
          var digits = (input.value || '').replace(/\D/g, '');
          input.value = digits ? '₩ ' + fmt(Math.min(Number(digits), MAX)) : '';
          syncAmountButtons();
          refreshNextState();
          renderPromotions();
        });

        function promoBonusAmount(p) {
          var amt = amountNumber();
          var cfg = p.prize && p.prize.percentage;
          if (!amt || !cfg || amt < cfg.min_deposit_amount) return 0;
          return Math.min(Math.max(amt * cfg.bonus_percentage / 100, cfg.min_bonus_amount || 0), cfg.max_bonus_amount || Infinity);
        }

        /* 對照原始碼 turnoverText:未參加任何優惠時,流水就是入金金額本身 */
        function promoTurnoverAmount(p) {
          var amt = amountNumber();
          if (!p || !amt) return 0;
          if (p.promotion_id === 'none') return amt;
          var cfg = p.prize && p.prize.percentage;
          if (!cfg || amt < cfg.min_deposit_amount) return 0;
          return (amt + promoBonusAmount(p)) * (p.deposit_turnover_multiplier || 1);
        }

        /* 對照真實網站截圖:選中的優惠會在同一張卡片內,左側名稱+條列說明、
           右側直接顯示「+₩ 金額 보너스」,中間一條分隔線,不是另外拉一條
           跨版面寬度的漸層橫幅 */
        function renderPromotions() {
          var wrap = W.qs('[data-promotion-list]');
          wrap.innerHTML = promotions.map(function (p, i) {
            var selected = i === selectedPromoIndex;
            var bullets = (p.remarkKeys || []).map(function (k) { return '<li>' + W.t(k) + '</li>'; }).join('');
            var body;
            if (selected) {
              var bonusText = fmt(Math.round(promoBonusAmount(p)));
              var turnoverLabel = W.t('userCenter.withdrawalPage.requiredTurnoverAmount') + '：₩ ' + fmt(Math.round(promoTurnoverAmount(p)));
              body =
                '<div class="promo-card-columns">' +
                '<div class="promo-card-name-col"><strong>' + W.t(p.nameKey) + '</strong>' +
                (bullets ? '<ul class="promo-card-remarks">' + bullets + '</ul>' : '') +
                '</div>' +
                '<div class="promo-card-bonus-col">＋₩ ' + bonusText + ' ' + W.t('userCenter.bonus') + '</div>' +
                '</div>' +
                '<hr class="promo-card-hr"><div class="promo-card-turnover">' + turnoverLabel + '</div>';
            } else {
              body = '<strong>' + W.t(p.nameKey) + '</strong>' + (bullets ? '<ul class="promo-card-remarks">' + bullets + '</ul>' : '');
            }
            return (
              '<div class="promo-card' + (selected ? ' is-selected' : '') + '" data-promo-index="' + i + '">' +
              '<div class="promo-card-row"><span class="promo-radio"><span class="promo-radio-dot"></span></span>' +
              '<div class="promo-card-body">' + body +
              '</div></div></div>'
            );
          }).join('');
          W.qsa('[data-promo-index]', wrap).forEach(function (el) {
            W.on(el, 'click', function () {
              selectedPromoIndex = Number(el.getAttribute('data-promo-index'));
              renderPromotions();
            });
          });
        }

        renderPromotions();
        setAmount(DEFAULT_AMOUNT);

        W.on(nextBtn, 'click', function () {
          if (nextBtn.disabled) return;
          var p = promotions[selectedPromoIndex];
          var bonus = p ? Math.round(promoBonusAmount(p)) : 0;
          location.href = 'transaction-info.html?type=deposit&amount=' + encodeURIComponent(amountNumber()) + (bonus > 0 ? '&bonus=' + bonus : '');
        });
      };
    </script>
  </body>
</html>
