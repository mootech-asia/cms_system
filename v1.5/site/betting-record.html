<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_前台_v1.5</title>
    <link rel="stylesheet" href="assets/css/main.css?v=13" />
  </head>
  <body>
    <div class="page-shell">
      <div data-mount="header"></div>
      <main class="usercenter-main">
        <div data-mount="user-navbar"></div>
        <div class="usercenter-grid">
          <div data-mount="user-sidebar"></div>
          <div class="usercenter-content">
            <div class="record-page">
              <h1 class="account-page-title" data-i18n="userCenter.sidebar.bettingRecord">베팅 기록</h1>
              <div class="record-inner">
                <div class="record-tags">
                  <button type="button" class="record-date-btn">2026-08-01 ~ 2026-08-12</button>
                  <button type="button" class="record-confirm-btn" data-i18n="common.confirm">확인</button>
                </div>

                <div class="record-table-wrap">
                  <table class="record-table record-mobile-only record-mobile-table">
                    <thead>
                      <tr>
                        <th data-i18n="userCenter.common.headers.orderNo">주문번호</th>
                        <th data-i18n="userCenter.common.headers.game">게임</th>
                        <th data-i18n="userCenter.common.headers.settlementTime">정산 시간</th>
                        <th data-i18n="userCenter.common.headers.betPL">베팅 손익</th>
                      </tr>
                    </thead>
                    <tbody data-record-body-mobile></tbody>
                  </table>

                  <table class="record-table record-desktop-only">
                    <thead>
                      <tr>
                        <th data-i18n="userCenter.common.headers.orderNo">주문번호</th>
                        <th data-i18n="userCenter.common.headers.game">게임</th>
                        <th data-i18n="userCenter.common.headers.settlementTime">정산 시간</th>
                        <th data-i18n="userCenter.common.headers.betAmount">베팅 금액</th>
                        <th data-i18n="userCenter.common.headers.validBet">유효 베팅</th>
                        <th data-i18n="userCenter.common.headers.winAmount">당첨 금액</th>
                        <th data-i18n="userCenter.common.headers.result">결과</th>
                        <th data-i18n="userCenter.common.headers.betPL">베팅 손익</th>
                      </tr>
                    </thead>
                    <tbody data-record-body-desktop></tbody>
                  </table>
                </div>

                <div class="record-footer-total">
                  <div class="record-footer-total-inner">
                    <span data-i18n="userCenter.common.headers.totalProfitAndLoss">총 손익</span>
                    <span data-total-pl>0</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=13"></script>
    <script src="assets/js/site.js?v=13"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        function fmt(n) { return Number(n).toLocaleString('en-US'); }
        function plClass(n) { return n > 0 ? 'status-text-approved' : n < 0 ? 'status-text-reject' : ''; }

        var mobile = D.BETTING_RECORDS.map(function (r) {
          return '<tr><td>' + r.order_no + '</td><td>' + r.game + '</td><td>' + r.time + '</td><td class="' + plClass(r.pl) + '">' + fmt(r.pl) + '</td></tr>';
        }).join('');
        W.qs('[data-record-body-mobile]').innerHTML = mobile;

        var desktop = D.BETTING_RECORDS.map(function (r) {
          return '<tr><td>' + r.order_no + '</td><td>' + r.game + '</td><td>' + r.time + '</td><td>' + fmt(r.bet_amount) + '</td><td>' + fmt(r.valid_bet) + '</td><td>' + fmt(r.win_amount) + '</td><td class="' + (r.result === 'WIN' ? 'status-text-approved' : 'status-text-reject') + '">' + r.result + '</td><td class="' + plClass(r.pl) + '">' + fmt(r.pl) + '</td></tr>';
        }).join('');
        W.qs('[data-record-body-desktop]').innerHTML = desktop;

        var totalPl = D.BETTING_RECORDS.reduce(function (s, r) { return s + r.pl; }, 0);
        W.qs('[data-total-pl]').textContent = fmt(totalPl);

        W.initDateRangePicker(W.qs('.record-date-btn'));
      };
    </script>
  </body>
</html>
