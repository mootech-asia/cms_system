<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>

      <main class="bg-navy min-h-[60vh] pt-4 px-5 pb-12 xl:py-16 xl:px-[max(0px,calc(50%-480px))]">
        <div class="inline-block border-b-2 border-transparent [border-image:var(--g-primary)] [border-image-slice:1] pb-2 mb-2"><h1 class="text-gradient m-0 text-[20px] font-bold xl:text-[28px]" data-i18n="about.title">회사 소개</h1></div>

        <nav class="flex items-center overflow-x-auto border-b border-[#4f4f4f] [&::-webkit-scrollbar]:hidden [scrollbar-width:none] [-ms-overflow-style:none]" data-about-tabs></nav>

        <div class="mt-4" data-about-content></div>
      </main>

      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        var TABS = ['support', 'notice', 'about', 'privacy', 'info', 'addiction', 'rules', 'faq'];
        var active = TABS.indexOf(new URLSearchParams(location.search).get('tab')) !== -1
          ? new URLSearchParams(location.search).get('tab')
          : 'support';

        var tabsEl = W.qs('[data-about-tabs]');
        var contentEl = W.qs('[data-about-content]');

        var ABOUT_TAB_CLS = 'shrink-0 whitespace-nowrap !py-2 !px-4 !text-white !font-semibold !border-b-2 !border-transparent xl:!text-[16px] [&.is-active]:[border-image:var(--g-primary)] [&.is-active]:[border-image-slice:1]';
        function renderTabs() {
          tabsEl.innerHTML = TABS.map(function (key) {
            return '<button type="button" class="' + ABOUT_TAB_CLS + (key === active ? ' is-active' : '') +
              '" data-about-tab="' + key + '"><span class="' + (key === active ? 'text-gradient' : '') +
              '" data-i18n="about.tabs.' + key + '">' + W.t('about.tabs.' + key) + '</span></button>';
          }).join('');
          W.qsa('[data-about-tab]', tabsEl).forEach(function (btn) {
            W.on(btn, 'click', function () {
              active = btn.getAttribute('data-about-tab');
              renderTabs();
              renderContent();
            });
          });
        }

        function renderContent() {
          var data = (D.ABOUT_CONTENT && D.ABOUT_CONTENT[W.currentLocale()]) || {};
          if (active === 'faq') {
            var categories = (data.faq && data.faq.categories) || [];
            contentEl.innerHTML = categories.map(function (cat, ci) {
              var items = (cat.items || []).map(function (item, ii) {
                var key = ci + '-' + ii;
                return (
                  '<div class="bg-[#1d2647] border border-[#4f4f4f] rounded-lg mb-3" data-faq-item="' + key + '">' +
                  '<div class="flex items-center justify-between py-2.5 px-4 font-bold cursor-pointer" data-faq-toggle="' + key + '"><p>' + item.title + '</p>' +
                  '<svg class="w-4 h-4 text-white/80 shrink-0 ml-3 transition-transform duration-300 [.is-open_&]:rotate-180" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 10.117l3.71-2.886a.75.75 0 1 1 .92 1.19l-4.2 3.27a.75.75 0 0 1-.92 0l-4.2-3.27a.75.75 0 0 1-.09-1.11Z"></path></svg>' +
                  '</div>' +
                  '<div class="max-h-0 overflow-hidden px-4 text-[#e7e7e7] text-[14px] whitespace-pre-line leading-[1.6] transition-[max-height] duration-300 [.is-open_&]:max-h-[1000px] [.is-open_&]:pb-3">' + (item.detail || '') + '</div>' +
                  '</div>'
                );
              }).join('');
              return '<p class="text-gradient font-bold my-4">' + cat.title + '</p>' + items;
            }).join('');
            W.qsa('[data-faq-toggle]', contentEl).forEach(function (el) {
              W.on(el, 'click', function () {
                var item = W.qs('[data-faq-item="' + el.getAttribute('data-faq-toggle') + '"]', contentEl);
                item.classList.toggle('is-open');
              });
            });
          } else {
            var items = (data[active] && data[active].items) || [];
            contentEl.innerHTML = items.map(function (item) {
              return (
                '<div class="bg-[#1d2647] border border-[#4f4f4f] rounded-lg mb-5">' +
                '<div class="py-2 px-4 font-bold xl:text-[18px]' + (item.detail ? ' border-b border-[#4f4f4f]' : '') + '"><span class="text-gradient">' + item.title + '</span></div>' +
                (item.detail ? '<div class="py-2 px-4 text-[#e7e7e7] text-[14px] whitespace-pre-line leading-[1.6]">' + item.detail + '</div>' : '') +
                '</div>'
              );
            }).join('');
          }
        }

        renderTabs();
        renderContent();
      };
    </script>
  </body>
</html>
