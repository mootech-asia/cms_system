<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>

      <main class="bg-navy min-h-[60vh]">
        <section class="relative bg-navy overflow-hidden">
          <!-- TODO: 暫用首頁 banner 素材佔位,待各分類正式 banner 到位後替換 -->
          <div class="relative w-full">
            <div class="w-full block"><img src="assets/images/banner/banner.jpg" alt="banner" class="w-full block" /></div>
          </div>
        </section>

        <section class="w-full bg-navy-2 h-[30px] relative text-[13px] overflow-hidden hidden xl:block xl:text-[14px]">
          <div class="overflow-hidden mr-[190px] h-full flex items-center">
            <div class="flex w-max whitespace-nowrap [will-change:transform] [animation:home-marquee_24s_linear_infinite]" data-marquee-track></div>
          </div>
          <div class="absolute right-4 top-1/2 -translate-y-1/2 text-white text-[12px] whitespace-nowrap" data-marquee-clock></div>
        </section>

        <div class="px-5 py-6 xl:px-24 xl:py-16">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-gradient text-[20px] font-bold xl:text-[28px]" data-gf-title></span>
          </div>
          <div class="flex flex-col gap-4 justify-between mt-4 md:flex-row md:items-end">
            <div class="flex md:flex-none" data-gf-tabs></div>
            <form class="flex items-center gap-2 md:ml-auto" data-gf-search-form>
              <input type="text" class="flex-1 h-10 rounded-lg bg-[#1e1e1e] border border-white/10 text-white px-4 !text-[14px] placeholder:text-[#e7e7e7] md:w-72" data-gf-search-input />
              <button type="submit" class="border-gradient-mask shrink-0 flex items-center !py-2 !px-3 !font-bold">
                <img src="assets/images/icon/search-gradient.svg" alt="search" class="w-[18px] h-[18px] mr-1" />
                <span class="text-gradient" data-i18n="common.search">검색</span>
              </button>
            </form>
          </div>

          <div data-gf-body></div>
        </div>
      </main>

      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        var PAGE_SIZE = 12;
        /* main.css 的 button{border:0;padding:0;...} 只重置 border-width/
           style/color,不影響 border-image/border-image-slice,所以
           is-active 的漸層底線不用加 !,但 base 的 border-b 本身要加 */
        var GF_TAB_CLS = 'flex-1 text-center !py-2 !px-4 !font-bold !text-white !border-b !border-[#4f4f4f] whitespace-nowrap md:flex-none [&.is-active]:[border-image:var(--g-primary)] [&.is-active]:[border-image-slice:1]';

        /* ---- Marquee(對照 gameType.vue,與首頁共用同一份跑馬燈資料) ---- */
        var track = W.qs('[data-marquee-track]');
        if (track) {
          var itemsHtml = D.MARQUEE_ITEMS.map(function (m) {
            var b = '<b class="text-gold font-bold">$1</b>';
            var highlighted = m.title.replace(/^(\S+) won/, b + ' won').replace(/([\d,]{4,})/, b);
            return '<span class="inline-block font-bold text-white mr-6">✦ ' + highlighted + ' ✦</span>';
          }).join('');
          track.innerHTML = itemsHtml + itemsHtml;
        }
        var clock = W.qs('[data-marquee-clock]');
        function updateClock() {
          var d = new Date(Date.now() + 8 * 60 * 60 * 1000);
          function pad(n) { return String(n).padStart(2, '0'); }
          clock.textContent = 'GMT+8 ' + d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
        }
        if (clock) { updateClock(); setInterval(updateClock, 1000); }

        var TITLE_KEYS = {
          hotgames: 'gameType.types.hotGames',
          mini_game: 'gameType.types.miniGames',
          slot: 'gameType.types.slots',
          sports: 'gameType.types.sports',
          live: 'gameType.types.liveCasino',
          fish: 'gameType.types.fish',
        };
        var ALL_GAMES_TYPES = ['slot', 'mini_game', 'fish'];

        var type = new URLSearchParams(location.search).get('type') || 'hotgames';
        var showOptions = type !== 'hotgames';
        var showAllGamesTab = ALL_GAMES_TYPES.indexOf(type) !== -1;
        var activeOption = type === 'hotgames' ? 'hotgames' : showAllGamesTab ? 'allGames' : 'vendor';
        var query = '';
        var visibleCount = PAGE_SIZE;

        var titleEl = W.qs('[data-gf-title]');
        var tabsEl = W.qs('[data-gf-tabs]');
        var bodyEl = W.qs('[data-gf-body]');
        var searchInput = W.qs('[data-gf-search-input]');

        titleEl.textContent = W.t(TITLE_KEYS[type] || '');
        searchInput.placeholder = activeOption === 'vendor' ? W.t('common.vendorName') : W.t('common.gameName');

        function flatPool() {
          if (type === 'hotgames') return D.FLAT_GAMES.hotgames;
          return D.FLAT_GAMES[type] || [];
        }

        function renderTabs() {
          if (!showOptions) { tabsEl.innerHTML = ''; return; }
          var opts = [];
          if (showAllGamesTab) opts.push({ id: 'allGames', label: W.t('gameList.options.all') });
          opts.push({ id: 'vendor', label: W.t('gameType.options.vendor') });
          opts.push({ id: 'favorites', label: W.t('gameType.options.favorites') });
          tabsEl.innerHTML = opts.map(function (o) {
            return '<button type="button" class="' + GF_TAB_CLS + (o.id === activeOption ? ' is-active' : '') +
              '" data-gf-option="' + o.id + '"><span class="' + (o.id === activeOption ? 'text-gradient' : '') + '">' + o.label + '</span></button>';
          }).join('');
          W.qsa('[data-gf-option]', tabsEl).forEach(function (btn) {
            W.on(btn, 'click', function () {
              activeOption = btn.getAttribute('data-gf-option');
              query = '';
              searchInput.value = '';
              visibleCount = PAGE_SIZE;
              searchInput.placeholder = activeOption === 'vendor' ? W.t('common.vendorName') : W.t('common.gameName');
              renderTabs();
              renderBody();
            });
          });
        }

        function goToGame(vendor) {
          if (type === 'live' || type === 'sports') {
            location.href = 'sports.html?vendor=' + encodeURIComponent(vendor.vendor) + '&gameId=' + encodeURIComponent(vendor.vendor) + '&type=' + type;
          } else {
            location.href = 'game-list.html?vendor=' + encodeURIComponent(vendor.vendor) + '&type=' + type;
          }
        }

        function renderVendorGrid() {
          var vendors = (D.GAME_VENDORS[type] || []).filter(function (v) {
            return !query || v.vendor.toLowerCase().indexOf(query) !== -1;
          });
          if (!vendors.length) {
            bodyEl.innerHTML = '<div class="py-16 text-center text-white/60 text-[14px]" data-i18n="common.noData">' + W.t('common.noData') + '</div>';
            return;
          }
          bodyEl.innerHTML = '<div class="grid grid-cols-3 gap-4 mt-7 md:grid-cols-4 xl:gap-7">' + vendors.map(function (v, idx) {
            var bg = type === 'live'
              ? 'assets/images/index/mainGame/live/live_' + (idx % 33) + '.webp'
              : type === 'sports'
              ? 'assets/images/index/mainGame/img-livegame-bg.webp'
              : 'assets/images/' + D.GAME_THUMB_POOL[idx % D.GAME_THUMB_POOL.length];
            return (
              '<div class="relative h-40 rounded-3xl overflow-hidden bg-[#0b1733] shadow-[inset_0_0_0_1px_rgba(255,255,255,0.1)] cursor-pointer" data-gf-vendor="' + idx + '">' +
              '<img class="absolute inset-0 w-full h-full object-cover" src="' + bg + '" alt="">' +
              '<img class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 !max-w-[55%] max-h-[55%] object-contain drop-shadow-[0_2px_6px_rgba(0,0,0,0.45)]" src="assets/images/index/mainGame/live/' + encodeURIComponent(v.logo) + '" alt="' + v.vendor + '">' +
              '</div>'
            );
          }).join('') + '</div>';
          W.qsa('[data-gf-vendor]', bodyEl).forEach(function (el) {
            W.on(el, 'click', function () { goToGame(vendors[Number(el.getAttribute('data-gf-vendor'))]); });
          });
        }

        function renderGameGrid(games) {
          var filtered = games.filter(function (g) {
            return !query || g.display_name.toLowerCase().indexOf(query) !== -1;
          });
          if (!filtered.length) {
            bodyEl.innerHTML = '<div class="py-16 text-center text-white/60 text-[14px]" data-i18n="common.noData">' + W.t('common.noData') + '</div>';
            return;
          }
          var visible = filtered.slice(0, visibleCount);
          bodyEl.innerHTML = '<div class="grid grid-cols-3 gap-4 mt-7 md:grid-cols-6 2xl:grid-cols-7">' + visible.map(function (g, idx) {
            var thumbCls = 'relative rounded-2xl overflow-hidden shadow-[inset_0_0_0_1px_rgba(255,255,255,0.1)] bg-[#0b1733]';
            return (
              '<div class="group cursor-pointer" data-gf-game="' + idx + '">' +
              (g.desktop_icon_url
                ? '<div class="' + thumbCls + '"><img src="assets/images/' + g.desktop_icon_url + '" alt="' + g.display_name + '" class="w-full aspect-square object-cover transition-transform duration-1000 ease-out group-hover:scale-[1.15]"></div>'
                : '<div class="' + thumbCls + '"><img src="assets/images/img-comingsoon-game.png" alt="coming soon" class="w-full aspect-square object-contain p-[16%] transition-transform duration-1000 ease-out group-hover:scale-[1.15]"></div>') +
              '<div class="pt-2 px-1 pb-0"><p class="text-white font-bold text-[13px] whitespace-nowrap overflow-hidden text-ellipsis xl:text-[18px]">' + g.display_name + '</p>' +
              '<div class="flex items-center justify-between mt-0.5"><span class="text-white/60 text-[12px] whitespace-nowrap overflow-hidden text-ellipsis">' + g.provider + '</span>' +
              '<button type="button" class="shrink-0 w-4 h-4" data-gf-fav="' + idx + '"><img src="assets/images/icon/' + (g.isFavorite ? 'like-fill.svg' : 'like.svg') + '" alt="fav" class="w-full h-full"></button>' +
              '</div></div></div>'
            );
          }).join('') + '</div>' +
          (visible.length < filtered.length ? '<div class="flex justify-center mt-7"><button type="button" class="border-gradient-mask !py-2.5 !px-8 !font-bold !bg-transparent" data-gf-more><span class="text-gradient" data-i18n="common.readMore">' + W.t('common.readMore') + '</span></button></div>' : '');
          W.qsa('[data-gf-fav]', bodyEl).forEach(function (btn) {
            W.on(btn, 'click', function (e) {
              e.stopPropagation();
              var g = visible[Number(btn.getAttribute('data-gf-fav'))];
              g.isFavorite = !g.isFavorite;
              renderBody();
            });
          });
          W.qsa('[data-gf-game]', bodyEl).forEach(function (el) {
            W.on(el, 'click', function () {
              W.showAlert({ type: 'success', message: W.t('common.openingGame') });
            });
          });
          W.on(W.qs('[data-gf-more]', bodyEl), 'click', function () {
            visibleCount += PAGE_SIZE;
            renderGameGrid(games);
          });
        }

        function renderBody() {
          if (activeOption === 'vendor') {
            renderVendorGrid();
          } else if (activeOption === 'favorites') {
            if (type === 'live' || type === 'sports') {
              bodyEl.innerHTML = '<div class="py-16 text-center text-white/60 text-[14px]" data-i18n="common.noData">' + W.t('common.noData') + '</div>';
            } else {
              renderGameGrid(flatPool().filter(function (g) { return g.isFavorite; }));
            }
          } else {
            renderGameGrid(flatPool());
          }
        }

        W.on(W.qs('[data-gf-search-form]'), 'submit', function (e) {
          e.preventDefault();
          query = (searchInput.value || '').trim().toLowerCase();
          visibleCount = PAGE_SIZE;
          renderBody();
        });

        renderTabs();
        renderBody();
      };
    </script>
  </body>
</html>
