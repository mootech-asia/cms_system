<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>

      <main class="bg-navy">
        <section class="relative bg-navy overflow-hidden">
          <div class="relative w-full" data-banner-slides>
            <div class="w-full block"><img src="assets/images/banner/banner.jpg" alt="banner" class="w-full block" /></div>
          </div>
        </section>

        <section class="w-full bg-[#c4416c] h-[30px] relative text-[13px] overflow-hidden xl:text-[14px]">
          <div class="overflow-hidden mr-[190px] h-full flex items-center">
            <div class="flex w-max whitespace-nowrap [will-change:transform] [animation:home-marquee_24s_linear_infinite]" data-marquee-track></div>
          </div>
          <div class="absolute right-4 top-1/2 -translate-y-1/2 text-white text-[12px] whitespace-nowrap" data-marquee-clock></div>
        </section>

        <section class="relative w-full px-5 py-6 xl:px-24">
          <div class="flex items-end justify-between pb-3 mb-5 border-b border-transparent [border-image:var(--g-primary)] [border-image-slice:1]">
            <div class="flex items-center gap-2 text-[18px] font-bold text-pink xl:text-[24px]">
              <img src="assets/images/index/game-icon.svg" alt="hot game" class="w-6 h-6" />
              <span data-i18n="gameType.types.hotGames">인기 게임</span>
            </div>
            <div class="flex items-center gap-3 text-white/70 text-[14px]">
              <button type="button" class="hover:!text-white" data-nav-href="game-type.html?type=hotgames" data-i18n="hotGame.seeAll">전체 보기</button>
              <button type="button" data-hot-game-prev><img class="w-5 h-5" src="assets/images/icon/arrow-left2.svg" alt="prev" /></button>
              <button type="button" data-hot-game-next><img class="w-5 h-5" src="assets/images/icon/arrow-right2.svg" alt="next" /></button>
            </div>
          </div>
          <div class="overflow-x-auto pb-1 [&::-webkit-scrollbar]:hidden" data-hot-game-strip>
            <div class="flex gap-5" data-hot-game-track></div>
          </div>
        </section>

        <section class="px-5 py-6 xl:px-24">
          <div class="flex items-end justify-between pb-3 mb-5 border-b border-transparent [border-image:var(--g-primary)] [border-image-slice:1]">
            <div class="flex items-center gap-2 text-[18px] font-bold text-pink xl:text-[24px]">
              <img src="assets/images/icon/liveCasino2.svg" alt="live casino" class="w-6 h-6" />
              <span data-i18n="navbar.top.liveCasino">라이브 카지노</span>
            </div>
            <div class="flex items-center gap-3 text-white/70 text-[14px]">
              <button type="button" class="hover:!text-white" data-nav-href="game-type.html?type=live" data-i18n="hotGame.seeAll">전체 보기</button>
              <button type="button" data-live-casino-prev><img class="w-5 h-5" src="assets/images/icon/arrow-left2.svg" alt="prev" /></button>
              <button type="button" data-live-casino-next><img class="w-5 h-5" src="assets/images/icon/arrow-right2.svg" alt="next" /></button>
            </div>
          </div>
          <div class="overflow-x-auto pb-1 [&::-webkit-scrollbar]:hidden"><div class="flex gap-4" data-live-casino-grid></div></div>
        </section>

        <section class="px-5 py-6 xl:px-24">
          <div class="flex items-end justify-between pb-3 mb-5 border-b border-transparent [border-image:var(--g-primary)] [border-image-slice:1]">
            <div class="flex items-center gap-2 text-[18px] font-bold text-pink xl:text-[24px]">
              <img src="assets/images/icon/liveSports.svg" alt="live sports" class="w-6 h-6" />
              <span data-i18n="navbar.top.sports">스포츠</span>
            </div>
            <div class="flex items-center gap-3 text-white/70 text-[14px]">
              <button type="button" class="hover:!text-white" data-nav-href="game-type.html?type=sports" data-i18n="hotGame.seeAll">전체 보기</button>
              <button type="button" data-live-sports-prev><img class="w-5 h-5" src="assets/images/icon/arrow-left2.svg" alt="prev" /></button>
              <button type="button" data-live-sports-next><img class="w-5 h-5" src="assets/images/icon/arrow-right2.svg" alt="next" /></button>
            </div>
          </div>
          <div class="overflow-x-auto pb-1 [&::-webkit-scrollbar]:hidden"><div class="flex gap-4" data-live-sports-grid></div></div>
        </section>

        <section class="px-5 py-6 xl:px-24">
          <div class="flex items-end justify-between pb-3 mb-5 border-b border-transparent [border-image:var(--g-primary)] [border-image-slice:1]">
            <div class="flex items-center gap-2 text-[18px] font-bold text-pink xl:text-[24px]">
              <img src="assets/images/icon/slotGames2.svg" alt="slot games" class="w-6 h-6" />
              <span data-i18n="navbar.top.slots">슬롯</span>
            </div>
            <div class="flex items-center gap-3 text-white/70 text-[14px]">
              <button type="button" class="hover:!text-white" data-nav-href="game-type.html?type=slot" data-i18n="hotGame.seeAll">전체 보기</button>
              <button type="button" data-slot-strip-prev><img class="w-5 h-5" src="assets/images/icon/arrow-left2.svg" alt="prev" /></button>
              <button type="button" data-slot-strip-next><img class="w-5 h-5" src="assets/images/icon/arrow-right2.svg" alt="next" /></button>
            </div>
          </div>
          <div class="overflow-x-auto pb-1 [&::-webkit-scrollbar]:hidden" data-slot-strip>
            <div class="flex gap-4" data-slot-strip-track></div>
          </div>
        </section>

        <section class="px-5 py-6 xl:px-24">
          <div class="overflow-x-auto [&::-webkit-scrollbar]:hidden" data-promo-home-strip>
            <div class="flex gap-4" data-promo-home-track></div>
          </div>
          <div class="flex items-center justify-center gap-2 mt-5" data-promo-home-dots></div>
          <div class="flex justify-center mt-4">
            <a class="py-2 px-5 rounded-full border border-pink !text-pink font-bold text-[14px] hover:bg-pink hover:!text-white" href="promotion-list.html" data-i18n="common.readMore">더보기</a>
          </div>
        </section>
      </main>

      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;

        /* ---- Marquee ---- */
        var track = W.qs('[data-marquee-track]');
        if (track) {
          var itemsHtml = D.MARQUEE_ITEMS.map(function (m) {
            var b = '<b class="text-gold font-bold">$1</b>';
            var highlighted = m.title.replace(/^(\S+) won/, b + ' won').replace(/([\d,]{4,})/, b);
            return '<span class="inline-block font-bold text-white mr-6">✦ ' + highlighted + ' ✦</span>';
          }).join('');
          track.innerHTML = itemsHtml + itemsHtml;
        }
        var clock = W.qs('[data-marquee-clock]');
        function updateClock() {
          var d = new Date(Date.now() + 8 * 60 * 60 * 1000);
          function pad(n) { return String(n).padStart(2, '0'); }
          clock.textContent = 'GMT+8 ' + d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
        }
        if (clock) { updateClock(); setInterval(updateClock, 1000); }

        /* ---- Hot Game(目前線上尚未上架真實遊戲,顯示 COMING SOON 占位卡片) ---- */
        var hgTrack = W.qs('[data-hot-game-track]');
        var hgStrip = W.qs('[data-hot-game-strip]');
        var HOT_GAME_CARD_CLS = 'shrink-0 w-[311px] h-[145px] bg-navy-soft rounded-2xl p-2 flex gap-3 cursor-pointer xl:w-[465px] xl:h-[220px]';
        function renderHotGames() {
          hgTrack.innerHTML = D.HOT_GAMES.map(function (g) {
            var thumb = g.image
              ? '<div class="w-[120px] h-full rounded-xl overflow-hidden shrink-0 bg-black/40 xl:w-[200px]"><img src="assets/images/' + g.image + '" alt="' + g.name + '" class="w-full h-full object-cover"></div>'
              : '<div class="w-[120px] h-full rounded-xl overflow-hidden shrink-0 bg-black/40 xl:w-[200px]"><img src="assets/images/img-comingsoon-game.png" alt="coming soon" class="w-full h-full object-contain p-3"></div>';
            return (
              '<div class="' + HOT_GAME_CARD_CLS + '" data-hot-game-card>' + thumb +
              '<div class="flex-1 min-w-0 flex flex-col justify-between"><div><span class="inline-block px-2.5 py-1 rounded-[10px] bg-[#5b6ea8] text-white text-[11px] font-bold mb-1.5" data-i18n="hotGame.promo">' + W.t('hotGame.promo') + '</span>' +
              '<h3 class="text-white font-bold text-[16px] whitespace-nowrap overflow-hidden text-ellipsis xl:text-[20px]">' + g.name + '</h3>' +
              '<p class="text-white/60 text-[12px] leading-[1.4] mt-1 line-clamp-2 xl:text-[14px]">' + g.subtitle + '</p></div>' +
              '<button type="button" class="mt-2 h-9 rounded-xl !bg-[image:var(--g-primary)] !text-navy !font-bold" data-i18n="hotGame.playNow">' + W.t('hotGame.playNow') + '</button></div>' +
              '</div>'
            );
          }).join('');
        }
        function moveHg(delta) {
          var card = hgTrack.querySelector('[data-hot-game-card]');
          var cardWidth = (card && card.offsetWidth) || 311;
          hgStrip.scrollBy({ left: delta * (cardWidth + 20), behavior: 'smooth' });
        }
        renderHotGames();
        W.on(W.qs('[data-hot-game-prev]'), 'click', function () { moveHg(-1); });
        W.on(W.qs('[data-hot-game-next]'), 'click', function () { moveHg(1); });

        /* ---- Live Casino / Live Sports(等大卡片,深底置中 logo + Play Now;
           直接吃 GAME_VENDORS(跟 game-type.html 內頁同一份廠商清單),數量
           跟內頁完全一致,不再另外維護一份會兜不齊的清單) ---- */
        var VENDOR_CARD_CLS = 'flex-[1_1_220px] min-w-[220px] flex flex-col items-center justify-center gap-4 h-[180px] rounded-2xl bg-navy-soft cursor-pointer p-4 md:flex-[1_1_260px] md:min-w-[260px] xl:flex-[1_1_311px] xl:min-w-[311px] xl:h-[220px]';
        function vendorCardHtml(v) {
          return (
            '<div class="' + VENDOR_CARD_CLS + '" data-vendor-card>' +
            '<img class="!max-w-[70%] max-h-12 object-contain" src="assets/images/index/mainGame/live/' + encodeURIComponent(v.logo) + '" alt="' + v.vendor + '">' +
            '<span class="py-2 px-6 rounded-[10px] bg-[image:var(--g-primary)] text-navy font-bold" data-i18n="hotGame.playNow">' + W.t('hotGame.playNow') + '</span>' +
            '</div>'
          );
        }
        W.qs('[data-live-casino-grid]').innerHTML = D.GAME_VENDORS.live.map(vendorCardHtml).join('');
        W.qs('[data-live-sports-grid]').innerHTML = D.GAME_VENDORS.sports.map(vendorCardHtml).join('');
        W.qsa('[data-vendor-card]').forEach(function (el) {
          W.on(el, 'click', function () { W.showAlert({ type: 'success', message: W.t('common.openingGame') }); });
        });
        function moveVendor(grid, delta) {
          var card = grid.querySelector('[data-vendor-card]');
          var cardWidth = (card && card.offsetWidth) || 220;
          grid.parentElement.scrollBy({ left: delta * (cardWidth + 16), behavior: 'smooth' });
        }
        var liveCasinoGrid = W.qs('[data-live-casino-grid]');
        var liveSportsGrid = W.qs('[data-live-sports-grid]');
        W.on(W.qs('[data-live-casino-prev]'), 'click', function () { moveVendor(liveCasinoGrid, -1); });
        W.on(W.qs('[data-live-casino-next]'), 'click', function () { moveVendor(liveCasinoGrid, 1); });
        W.on(W.qs('[data-live-sports-prev]'), 'click', function () { moveVendor(liveSportsGrid, -1); });
        W.on(W.qs('[data-live-sports-next]'), 'click', function () { moveVendor(liveSportsGrid, 1); });

        /* ---- Slot Games 橫向捲動 ---- */
        var slotTrack = W.qs('[data-slot-strip-track]');
        var slotStrip = W.qs('[data-slot-strip]');
        slotTrack.innerHTML = D.SLOT_STRIP_IMAGES.map(function (img) {
          return (
            '<div class="shrink-0 w-[120px] xl:w-[165px]" data-slot-strip-card>' +
            '<div class="w-[120px] h-[120px] rounded-2xl overflow-hidden bg-navy-soft xl:w-[165px] xl:h-[165px]"><img src="assets/images/' + img + '" alt="game" class="w-full h-full object-cover"></div>' +
            '<p class="text-white font-bold text-[14px] mt-2 whitespace-nowrap overflow-hidden text-ellipsis" data-i18n="hotGame.gameName">Game Name</p>' +
            '<p class="text-white/60 text-[12px]" data-i18n="hotGame.creativeGaming">Creative Gaming</p>' +
            '</div>'
          );
        }).join('');
        function moveSlot(delta) {
          var card = slotTrack.querySelector('[data-slot-strip-card]');
          var cardWidth = (card && card.offsetWidth) || 140;
          slotStrip.scrollBy({ left: delta * (cardWidth + 16), behavior: 'smooth' });
        }
        W.on(W.qs('[data-slot-strip-prev]'), 'click', function () { moveSlot(-1); });
        W.on(W.qs('[data-slot-strip-next]'), 'click', function () { moveSlot(1); });

        /* ---- 首頁促銷卡片 ---- */
        var promoTrack = W.qs('[data-promo-home-track]');
        var promoDots = W.qs('[data-promo-home-dots]');
        var PROMO_COIN_CLS = 'absolute rounded-full bg-[radial-gradient(circle_at_30%_30%,#ffe08a,#d98a1a)]';
        var PROMO_DOT_CLS = 'w-2.5 h-2.5 rounded-full bg-white/40 [&.is-active]:w-4 [&.is-active]:h-4 [&.is-active]:bg-transparent [&.is-active]:border-2 [&.is-active]:border-white';
        promoTrack.innerHTML = D.PROMO_HOME_CARDS.map(function () {
          return (
            '<a class="shrink-0 w-[240px] rounded-2xl overflow-hidden cursor-pointer xl:w-[280px]" href="promotion-list.html" data-promo-home-card>' +
            '<div class="relative h-[120px] py-5 px-4 bg-[linear-gradient(135deg,#2a2560,#100c2e)] overflow-hidden before:content-[\'PROMOTION\'] before:absolute before:left-4 before:-bottom-3.5 before:text-[46px] before:font-extrabold before:text-white/6 before:whitespace-nowrap before:pointer-events-none after:content-[\'%\'] after:absolute after:right-2 after:-bottom-5 after:text-[72px] after:font-extrabold after:text-white/5 after:pointer-events-none">' +
            '<div class="' + PROMO_COIN_CLS + ' w-6.5 h-6.5 right-8.5 top-4"></div><div class="' + PROMO_COIN_CLS + ' w-9.5 h-9.5 right-3.5 top-6.5"></div><div class="' + PROMO_COIN_CLS + ' w-4.5 h-4.5 right-7.5 top-17"></div>' +
            '<p class="relative z-[1] text-white/50 text-[11px] tracking-[2px] font-bold" data-i18n="hotGame.specialOffer">SPECIAL OFFER</p>' +
            '<p class="relative z-[1] text-[28px] font-extrabold leading-none mt-2 [background-image:linear-gradient(180deg,#ffd88a,#f3ac2f)] bg-clip-text text-transparent">PROMOTION</p>' +
            '</div>' +
            '<p class="m-0 bg-[image:var(--g-primary)] text-navy font-bold text-[13px] text-center py-2" data-i18n="hotGame.promoDateRange">Thursday-Tuesday, times vary</p>' +
            '<p class="m-0 bg-[#d9dbe6] text-[#111] text-[13px] font-semibold py-2.5 px-3.5" data-i18n="hotGame.promotion1">Promotion 1</p>' +
            '</a>'
          );
        }).join('');
        promoDots.innerHTML = D.PROMO_HOME_CARDS.map(function (_, i) {
          return '<span class="' + PROMO_DOT_CLS + (i === 0 ? ' is-active' : '') + '" data-promo-dot="' + i + '"></span>';
        }).join('');
        var promoStrip = W.qs('[data-promo-home-strip]');
        var promoDotEls = W.qsa('[data-promo-dot]', promoDots);
        function promoCardStep() {
          var card = promoTrack.querySelector('[data-promo-home-card]');
          var trackStyle = window.getComputedStyle(promoTrack);
          return ((card && card.offsetWidth) || 240) + (parseFloat(trackStyle.gap) || 0);
        }
        promoDotEls.forEach(function (dot, i) {
          W.on(dot, 'click', function () {
            promoStrip.scrollTo({ left: i * promoCardStep(), behavior: 'smooth' });
          });
        });
        W.on(promoStrip, 'scroll', function () {
          var active = Math.round(promoStrip.scrollLeft / promoCardStep());
          promoDotEls.forEach(function (dot, i) { dot.classList.toggle('is-active', i === active); });
        });

        /* ---- 首頁進站廣告彈窗(對照 components/PromotionModal.vue,
           demo 環境沒有真實公告 API,固定取 D.PROMOTIONS 前 4 筆促銷;
           手機一次顯示一張、關閉後換下一張,桌機(>=1280px)同時顯示最多
           3 張,比照 Nuxt 版 desktopCards 的上限。「今天不再提醒」勾選
           才寫入 localStorage,key 每天自動換新，跟原本單張版邏輯一致，
           只是能擴充成多張。 ---- */
        (function initPromoPopup() {
          var ALL = (D.PROMOTIONS || []).slice(0, 4);
          if (!ALL.length) return;
          function todayKey() {
            var d = new Date();
            function pad(n) { return String(n).padStart(2, '0'); }
            return 'promotion_' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
          }
          var dismissedIds = [];
          try { dismissedIds = JSON.parse(localStorage.getItem(todayKey()) || '[]'); } catch (e) {}
          var cards = ALL.filter(function (p) { return dismissedIds.indexOf(String(p.promotion_id)) === -1; });
          if (!cards.length) return;

          var isDesktop = window.matchMedia('(min-width: 1280px)').matches;
          var loc = W.currentLocale();
          var backdrop = document.createElement('div');
          backdrop.className = 'fixed inset-0 z-[280] bg-black/70 flex items-center justify-center p-4';
          document.body.appendChild(backdrop);

          function cardHTML(promo) {
            return (
              '<div class="flex flex-col w-[min(280px,calc(100vw-32px))] h-[min(436px,calc(100dvh-32px))] bg-white/50 rounded-2xl overflow-hidden xl:w-[430px] xl:h-[626px]" data-promo-card="' + promo.promotion_id + '">' +
              '<div class="shrink-0 h-[54px] flex items-center justify-between px-5 xl:h-[72px] xl:px-7">' +
              '<img src="' + W.IMG + 'index/img-logo.png" alt="logo" class="w-21 xl:w-35">' +
              '<button type="button" class="w-5 h-5" data-promo-popup-close><img src="' + W.icon('close.svg') + '" alt="close" class="w-full h-full"></button>' +
              '</div>' +
              '<div class="flex-1 min-h-0 overflow-hidden cursor-pointer" data-promo-popup-content><img src="' + W.IMG + 'index/promotion/' + promo.image + '" alt="' + promo.title[loc] + '" class="w-full h-full object-cover object-center block"></div>' +
              '<div class="shrink-0 flex items-center justify-center gap-1.5 py-3 px-4 bg-white/50">' +
              '<input type="checkbox" class="w-5 h-5 accent-navy" data-promo-popup-remember>' +
              '<span class="text-navy text-[13px] xl:text-[14px] xl:font-bold" data-i18n="promotion.dontRemindToday">' + W.t('promotion.dontRemindToday') + '</span>' +
              '</div>' +
              '</div>'
            );
          }

          function persistDismiss(id) {
            var key = todayKey();
            var list = [];
            try { list = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
            list.push(String(id));
            localStorage.setItem(key, JSON.stringify(list));
          }

          function bindCard(cardEl, promo) {
            W.on(W.qs('[data-promo-popup-close]', cardEl), 'click', function (e) {
              e.stopPropagation();
              if (W.qs('[data-promo-popup-remember]', cardEl).checked) persistDismiss(promo.promotion_id);
              closeCard(promo.promotion_id);
            });
            W.on(W.qs('[data-promo-popup-content]', cardEl), 'click', function () {
              location.href = 'promotion-detail.html?id=' + promo.promotion_id;
            });
          }

          var current = 0; // 手機模式:目前顯示 cards 的第幾筆
          function renderMobile() {
            if (current >= cards.length) { backdrop.remove(); return; }
            var promo = cards[current];
            backdrop.innerHTML = cardHTML(promo);
            bindCard(backdrop.firstElementChild, promo);
          }

          function closeCard(id) {
            if (isDesktop) {
              var el = W.qs('[data-promo-card="' + id + '"]', backdrop);
              if (el) el.remove();
              if (!W.qs('[data-promo-card]', backdrop)) backdrop.remove();
            } else {
              current += 1;
              renderMobile();
            }
          }

          if (isDesktop) {
            var stage = document.createElement('div');
            stage.className = 'flex items-center justify-center gap-6';
            var shown = cards.slice(0, 3);
            stage.innerHTML = shown.map(cardHTML).join('');
            backdrop.appendChild(stage);
            shown.forEach(function (promo) {
              bindCard(W.qs('[data-promo-card="' + promo.promotion_id + '"]', stage), promo);
            });
          } else {
            renderMobile();
          }
        })();

        W.applyLocale();
      };
    </script>
  </body>
</html>
