<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>

      <main class="bg-navy pt-8 xl:pt-16">
        <div data-sf-body></div>
      </main>

      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var W = window.WIN15;
        var params = new URLSearchParams(location.search);
        var vendor = params.get('vendor') || '';
        var gameId = params.get('gameId') || '';
        var bodyEl = W.qs('[data-sf-body]');

        if (!vendor || !gameId) {
          W.showAlert({ type: 'error', message: W.t('common.error') });
          return;
        }

        /* 靜態預覽無真實第三方遊戲伺服器,以 iframe srcdoc 模擬 api.openGame() 回傳的遊戲畫面 */
        var placeholderHtml =
          '<!doctype html><html><head><meta charset="utf-8"><style>' +
          'html,body{margin:0;height:100%;background:#060c34;display:flex;align-items:center;justify-content:center;' +
          'font-family:Arial,Helvetica,sans-serif;color:#fff;text-align:center}' +
          '.box{padding:24px}.name{font-size:22px;font-weight:700;margin-bottom:8px}' +
          '.sub{color:rgba(255,255,255,.6);font-size:14px}' +
          '</style></head><body><div class="box">' +
          '<div class="name">' + vendor + '</div><div class="sub">game_id: ' + gameId + '</div>' +
          '</div></body></html>';

        if (window.matchMedia('(min-width: 1281px)').matches) {
          bodyEl.innerHTML = '<iframe class="w-full h-[calc(100vh-64px)] border-0 block xl:h-[calc(100vh-128px)]" srcdoc="' + placeholderHtml.replace(/"/g, '&quot;') + '" allowfullscreen></iframe>';
        } else {
          bodyEl.innerHTML = '<div class="min-h-[40vh] flex items-center justify-center text-white text-[15px] text-center px-5" data-i18n="common.openingGame">' + W.t('common.openingGame') + '</div>';
          var blobUrl = 'data:text/html,' + encodeURIComponent(placeholderHtml);
          window.open(blobUrl, '_blank');
          setTimeout(function () { history.back(); }, 400);
        }
      };
    </script>
  </body>
</html>
