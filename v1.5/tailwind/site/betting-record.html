<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 max-xl:[body.is-usercenter_&]:pt-0 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>
      <main class="pt-0">
        <div data-mount="user-navbar"></div>
        <div class="grid grid-cols-1">
          <div data-mount="user-sidebar"></div>
          <div class="w-full bg-white overflow-x-hidden xl:ml-[260px] xl:w-[calc(100%-260px)]">
            <div class="bg-[#f2f2f2] min-h-[calc(100vh-var(--header-h-mobile))] flex flex-col xl:min-h-[calc(100vh-var(--header-h-desktop))]">
              <h1 class="hidden xl:block xl:h-[62px] xl:bg-white xl:text-navy xl:text-[32px] xl:font-bold xl:leading-[64px] xl:border-b xl:border-border xl:px-8 xl:mt-0 xl:mx-0 xl:mb-4" data-i18n="userCenter.sidebar.bettingRecord">베팅 기록</h1>
              <div class="max-w-[1190px] w-full mx-auto px-4 pt-3 pb-24 flex flex-col flex-1 xl:px-8 xl:pt-6 xl:pb-10">
                <div class="flex flex-wrap gap-2 items-center">
                  <button type="button" class="h-10 !px-3 rounded-lg !bg-white !border !border-border !text-navy !text-[14px] whitespace-nowrap" data-record-date-btn>2026-08-01 ~ 2026-08-12</button>
                  <button type="button" class="h-10 !px-4 rounded-lg !bg-navy !text-white !font-bold whitespace-nowrap" data-i18n="common.confirm">확인</button>
                </div>

                <div class="mt-4 overflow-x-auto xl:mb-4">
                  <table class="w-full min-w-0 border-collapse bg-white rounded-[10px] overflow-hidden text-[12px] text-center xl:hidden">
                    <thead>
                      <tr class="bg-[#f6e27b] text-navy font-bold">
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.orderNo">주문번호</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.game">게임</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.settlementTime">정산 시간</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.betPL">베팅 손익</th>
                      </tr>
                    </thead>
                    <tbody data-record-body-mobile></tbody>
                  </table>

                  <table class="hidden w-full min-w-[700px] border-collapse bg-white rounded-[10px] overflow-hidden text-[13px] text-center xl:table">
                    <thead>
                      <tr class="bg-[#f6e27b] text-navy font-bold">
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.orderNo">주문번호</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.game">게임</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.settlementTime">정산 시간</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.betAmount">베팅 금액</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.validBet">유효 베팅</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.winAmount">당첨 금액</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.result">결과</th>
                        <th class="py-3 px-2 whitespace-nowrap" data-i18n="userCenter.common.headers.betPL">베팅 손익</th>
                      </tr>
                    </thead>
                    <tbody data-record-body-desktop></tbody>
                  </table>
                </div>

                <div class="fixed inset-x-0 bottom-0 z-40 bg-navy-2 text-[#f6e27b] xl:static xl:mt-auto xl:rounded-lg">
                  <div class="max-w-[1190px] mx-auto h-12 px-4 flex items-center justify-between">
                    <span data-i18n="userCenter.common.headers.totalProfitAndLoss">총 손익</span>
                    <span data-total-pl>0</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>
      window.WIN15_PAGE_INIT = function () {
        var D = window.WIN15_DATA;
        var W = window.WIN15;
        function fmt(n) { return Number(n).toLocaleString('en-US'); }
        var STATUS_COLOR = { win: '#1dbf73', lose: '#e11d48' };
        function plStyle(n) { return n > 0 ? 'color:' + STATUS_COLOR.win : n < 0 ? 'color:' + STATUS_COLOR.lose : ''; }
        function plCls(n) { return n === 0 ? '' : ' font-bold'; }
        var TD_CLS = 'py-3 px-2 whitespace-nowrap';
        var TR_CLS = 'border-b border-border text-navy last:border-b-0';

        /* 體育串關展開列：只有 r.details 有內容的注單才附展開鈕（對照
           Nuxt bettingRecord.vue 的 toggleExpand/isExpanded），子表欄位
           對照同一份 pug template 的 detailHeaders（betType/leagueName/
           eventName/betChoice/odds/matchResult/winLoss）。league_name/
           event_name/bet_selection 是隊名等專有名詞，跟 game 欄位一樣
           不跟 t() 走；betType(Parlay/Single) 是 UI 詞彙，補上翻譯。 */
        var PARLAY_TH_CLS = 'py-1.5 px-2 text-[#6d6d6d] font-bold text-[11px] border-b border-border whitespace-nowrap';
        function parlayDetailRows(r, colspan) {
          if (!r.details || !r.details.length) return '';
          var head = '<tr>' +
            '<th class="' + PARLAY_TH_CLS + '" data-i18n="userCenter.bettingRecordPage.detailHeaders.betType">' + W.t('userCenter.bettingRecordPage.detailHeaders.betType') + '</th>' +
            '<th class="' + PARLAY_TH_CLS + '" data-i18n="userCenter.bettingRecordPage.detailHeaders.leagueName">' + W.t('userCenter.bettingRecordPage.detailHeaders.leagueName') + '</th>' +
            '<th class="' + PARLAY_TH_CLS + '" data-i18n="userCenter.bettingRecordPage.detailHeaders.eventName">' + W.t('userCenter.bettingRecordPage.detailHeaders.eventName') + '</th>' +
            '<th class="' + PARLAY_TH_CLS + '" data-i18n="userCenter.bettingRecordPage.detailHeaders.betChoice">' + W.t('userCenter.bettingRecordPage.detailHeaders.betChoice') + '</th>' +
            '<th class="' + PARLAY_TH_CLS + '" data-i18n="userCenter.bettingRecordPage.detailHeaders.odds">' + W.t('userCenter.bettingRecordPage.detailHeaders.odds') + '</th>' +
            '<th class="' + PARLAY_TH_CLS + '" data-i18n="userCenter.bettingRecordPage.detailHeaders.matchResult">' + W.t('userCenter.bettingRecordPage.detailHeaders.matchResult') + '</th>' +
            '<th class="' + PARLAY_TH_CLS + '" data-i18n="userCenter.bettingRecordPage.detailHeaders.winLoss">' + W.t('userCenter.bettingRecordPage.detailHeaders.winLoss') + '</th></tr>';
          var rows = r.details.map(function (d, idx) {
            var betTypeKey = 'userCenter.bettingRecordPage.detailValues.' + (d.parlay ? 'parlay' : 'single');
            var tdCls = 'py-[7px] px-2 whitespace-nowrap' + (idx === r.details.length - 1 ? '' : ' border-b border-border');
            return '<tr>' +
              '<td class="' + tdCls + '" data-i18n="' + betTypeKey + '">' + W.t(betTypeKey) + '</td>' +
              '<td class="' + tdCls + '">' + (d.league_name || '-') + '</td>' +
              '<td class="' + tdCls + '">' + (d.event_name || '-') + '</td>' +
              '<td class="' + tdCls + '">' + (d.bet_selection || '-') + '</td>' +
              '<td class="' + tdCls + '">' + (d.odds != null ? d.odds : '-') + '</td>' +
              '<td class="' + tdCls + '">' + (d.match_result || '-') + '</td>' +
              '<td class="' + tdCls + ' font-bold" style="color:' + (d.bet_result === 'WIN' ? STATUS_COLOR.win : STATUS_COLOR.lose) + '">' + (d.bet_result || '-') + '</td></tr>';
          }).join('');
          return '<tr data-parlay-detail hidden><td colspan="' + colspan + '" class="p-0"><div class="pt-2.5 px-2 pb-3.5 bg-[#f7f7f7] text-left"><table class="w-full border-collapse text-[12px] text-left text-navy"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div></td></tr>';
        }
        function expandBtn(r) {
          if (!r.details || !r.details.length) return r.order_no;
          return r.order_no + '<button type="button" class="inline-flex items-center justify-center w-5 h-5 ml-1.5 !border-0 rounded-[5px] !bg-transparent !text-navy align-middle cursor-pointer hover:!bg-[#00000010]" data-parlay-toggle aria-expanded="false" aria-label="Show parlay legs">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="block transition-transform duration-200 [.is-open_&]:rotate-180"><path d="m6 9 6 6 6-6"></path></svg></button>';
        }

        var mobile = D.BETTING_RECORDS.map(function (r) {
          return '<tr class="' + TR_CLS + '"><td class="' + TD_CLS + '">' + expandBtn(r) + '</td><td class="' + TD_CLS + '">' + r.game + '</td><td class="' + TD_CLS + '">' + r.time + '</td><td class="' + TD_CLS + plCls(r.pl) + '" style="' + plStyle(r.pl) + '">' + fmt(r.pl) + '</td></tr>' + parlayDetailRows(r, 4);
        }).join('');
        W.qs('[data-record-body-mobile]').innerHTML = mobile;

        var desktop = D.BETTING_RECORDS.map(function (r) {
          return '<tr class="' + TR_CLS + '"><td class="' + TD_CLS + '">' + expandBtn(r) + '</td><td class="' + TD_CLS + '">' + r.game + '</td><td class="' + TD_CLS + '">' + r.time + '</td><td class="' + TD_CLS + '">' + fmt(r.bet_amount) + '</td><td class="' + TD_CLS + '">' + fmt(r.valid_bet) + '</td><td class="' + TD_CLS + '">' + fmt(r.win_amount) + '</td><td class="' + TD_CLS + ' font-bold" style="color:' + (r.result === 'WIN' ? STATUS_COLOR.win : STATUS_COLOR.lose) + '">' + r.result + '</td><td class="' + TD_CLS + plCls(r.pl) + '" style="' + plStyle(r.pl) + '">' + fmt(r.pl) + '</td></tr>' + parlayDetailRows(r, 8);
        }).join('');
        W.qs('[data-record-body-desktop]').innerHTML = desktop;

        Array.prototype.slice.call(W.qsa('[data-parlay-toggle]')).forEach(function (btn) {
          W.on(btn, 'click', function () {
            var row = btn.closest('tr');
            var detail = row && row.nextElementSibling;
            if (!detail || !detail.hasAttribute('data-parlay-detail')) return;
            var open = row.classList.toggle('is-open');
            detail.hidden = !open;
            btn.setAttribute('aria-expanded', String(open));
          });
        });

        var totalPl = D.BETTING_RECORDS.reduce(function (s, r) { return s + r.pl; }, 0);
        W.qs('[data-total-pl]').textContent = fmt(totalPl);

        W.initDateRangePicker(W.qs('[data-record-date-btn]'));
      };
    </script>
  </body>
</html>
