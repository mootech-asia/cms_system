<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS_Frontend_v1.5</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=15" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body>
    <div class="min-h-screen pt-[var(--header-h-mobile)] pb-24 max-xl:[body.is-usercenter_&]:pt-0 xl:pt-[var(--header-h-desktop)] xl:pb-0">
      <div data-mount="header"></div>
      <main class="pt-0">
        <div data-mount="user-navbar"></div>
        <div class="grid grid-cols-1">
          <div data-mount="user-sidebar"></div>
          <div class="w-full bg-white overflow-x-hidden xl:ml-[260px] xl:w-[calc(100%-260px)]">
            <div class="bg-[#f2f2f2] pt-4 pb-25 min-h-[calc(100vh-var(--header-h-mobile))] xl:min-h-[calc(100vh-var(--header-h-desktop))]">
              <h1 class="hidden xl:block xl:m-0 xl:text-navy xl:text-[32px] xl:font-bold xl:pt-4 xl:px-8 xl:pb-2 xl:border-b xl:border-border-soft" data-i18n="userCenter.sidebar.securityCenter">보안 센터</h1>
              <div class="max-w-[945px] mx-auto px-4">
                <div>
                  <h2 class="text-navy text-[20px] font-bold m-0 mb-4" data-i18n="userCenter.securityCenterPage.lastLogin">마지막 로그인</h2>
                  <div class="rounded-[14px] bg-white overflow-hidden">
                    <div class="flex items-center justify-between py-5 px-4 border-b border-border-soft last:border-b-0"><span class="text-[#6d6d6d] text-[14px]" data-i18n="userCenter.securityCenterPage.time">시간</span><span class="text-navy font-bold">2026-08-11 13:29:25</span></div>
                    <div class="flex items-center justify-between py-5 px-4 border-b border-border-soft last:border-b-0"><span class="text-[#6d6d6d] text-[14px]" data-i18n="userCenter.securityCenterPage.ipAddress">IP 주소</span><span class="text-navy font-bold">125.227.44.193</span></div>
                  </div>
                </div>

                <div class="mt-4">
                  <h2 class="text-navy text-[20px] font-bold m-0 mb-4" data-i18n="userCenter.securityCenterPage.securitySetting">보안 설정</h2>
                  <div class="rounded-[10px] bg-white overflow-hidden">
                    <button type="button" class="w-full grid grid-cols-[auto_1fr_auto] items-center gap-2 !p-4 text-left !border-b !border-border-soft last:!border-b-0" data-nav-href="personal-info.html">
                      <img class="w-6 h-6" src="assets/images/icon/usercenter/personal.svg" alt="user" />
                      <div><p class="text-[14px] text-navy font-bold" data-i18n="userCenter.sidebar.personalInfo">개인 정보</p><p class="text-[12px] text-[#6d6d6d]" data-i18n="userCenter.securityCenterPage.completeProfile">개인 정보를 완료하세요</p></div>
                    </button>
                    <button type="button" class="w-full grid grid-cols-[auto_1fr_auto] items-center gap-2 !p-4 text-left !border-b !border-border-soft last:!border-b-0" data-nav-href="change-password.html?type=lgps">
                      <img class="w-6 h-6" src="assets/images/icon/usercenter/lock.svg" alt="lock" />
                      <div><p class="text-[14px] text-navy font-bold" data-i18n="userCenter.changePassword.changeLogin">로그인 비밀번호 변경</p><p class="text-[12px] text-[#6d6d6d]" data-i18n="userCenter.securityCenterPage.recommendAlphaNum">영문과 숫자 조합을 권장합니다</p></div>
                    </button>
                    <button type="button" class="w-full grid grid-cols-[auto_1fr_auto] items-center gap-2 !p-4 text-left !border-b !border-border-soft last:!border-b-0" data-nav-href="change-password.html?type=tsps">
                      <img class="w-6 h-6" src="assets/images/icon/usercenter/password.svg" alt="pin" />
                      <div><p class="text-[14px] text-navy font-bold" data-i18n="userCenter.changePassword.changeTransaction">거래 비밀번호 변경</p><p class="text-[12px] text-[#6d6d6d]" data-i18n="userCenter.securityCenterPage.setTxnPasswordTip">자금 보안을 위해 거래 비밀번호를 설정하세요</p></div>
                      <span class="text-[12px] flex items-center gap-1 text-[#1dbf73] font-bold" data-i18n="userCenter.securityCenterPage.set">설정</span>
                    </button>
                    <button type="button" class="w-full grid grid-cols-[auto_1fr_auto] items-center gap-2 !p-4 text-left !border-b !border-border-soft last:!border-b-0" data-nav-href="banking-details.html">
                      <img class="w-6 h-6" src="assets/images/icon/usercenter/creditCard.svg" alt="bank" />
                      <div><p class="text-[14px] text-navy font-bold" data-i18n="userCenter.securityCenterPage.bankAccountNumber">은행 계좌 번호</p><p class="text-[12px] text-[#6d6d6d]" data-i18n="userCenter.securityCenterPage.recommendAlphaNum">영문과 숫자 조합을 권장합니다</p></div>
                      <span class="text-[12px] flex items-center gap-1 text-[#1dbf73] font-bold" data-i18n="userCenter.securityCenterPage.set">설정</span>
                    </button>
                    <button type="button" class="w-full grid grid-cols-[auto_1fr_auto] items-center gap-2 !p-4 text-left !border-b !border-border-soft last:!border-b-0" data-logout>
                      <img class="w-6 h-6" src="assets/images/icon/usercenter/logout.svg" alt="logout" />
                      <div><p class="text-[14px] text-navy font-bold" data-i18n="userCenter.securityCenterPage.logout">로그아웃</p><p class="text-[12px] text-[#6d6d6d]" data-i18n="userCenter.securityCenterPage.logoutSafely">안전하게 로그아웃</p></div>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div data-mount="footer"></div>
      <div data-mount="bottom-nav"></div>
      <div data-mount="quick-sidebar"></div>
    </div>

    <script src="assets/js/data.js?v=15"></script>
    <script src="assets/js/site.js?v=15"></script>
    <script>window.WIN15_PAGE_INIT = function () {};</script>
  </body>
</html>
