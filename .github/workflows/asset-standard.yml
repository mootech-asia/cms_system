name: Validate asset standard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image inspection for delegated event checks
        if: ${{ hashFiles('scripts/event-assets.py') != '' }}
        run: python3 -m pip install Pillow
      - name: Verify registered files and delivery contracts
        run: python3 tools/assets.py check
